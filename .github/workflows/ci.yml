name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, tipos, testes, OpenAPI)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: giro
          POSTGRES_USER: giro
          POSTGRES_PASSWORD: giro-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U giro -d giro" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: chave-so-para-ci
      DATABASE_URL: postgres://giro:giro-ci@localhost:5432/giro
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Dependências do sistema (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b shared-mime-info
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: pytest -q
      - name: OpenAPI gerado igual a docs/api/openapi.yaml
        run: |
          python manage.py spectacular --file "$RUNNER_TEMP/openapi.yaml" --validate
          diff -u ../docs/api/openapi.yaml "$RUNNER_TEMP/openapi.yaml" || {
            echo "::error::docs/api/openapi.yaml desatualizado. Rode make api-schema e commite."
            exit 1
          }

  frontend:
    name: Frontend (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run api:gerar
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  infra:
    name: Infra (Compose e .env.example)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh infra/scripts/check-env.sh
      - run: cp .env.example .env && docker compose config --quiet
