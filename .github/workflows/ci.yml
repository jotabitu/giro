name: CI

# T-427: PR para a develop testa só o que mudou; a suíte inteira roda no push na develop e no PR
# da develop para a main. O que cada gatilho roda está em infra/README.md ("CI").
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

# PR: uma rodada nova cancela a anterior. Push na develop: cada commit tem a sua rodada, para
# uma falha não sumir debaixo da seguinte.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Decide quais áreas o PR toca e quanto testar, para não gastar minuto de Actions à toa.
  # Sem action de terceiros: o checkout de pull_request é o commit de merge,
  # e o primeiro pai dele é a ponta da base. A lógica está em infra/scripts/selecionar-testes.sh.
  areas:
    name: Áreas alteradas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detectar.outputs.backend }}
      frontend: ${{ steps.detectar.outputs.frontend }}
      infra: ${{ steps.detectar.outputs.infra }}
      backend_testes: ${{ steps.detectar.outputs.backend_testes }}
      backend_alvos: ${{ steps.detectar.outputs.backend_alvos }}
      frontend_testes: ${{ steps.detectar.outputs.frontend_testes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: detectar
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENTO" = "pull_request" ]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/alterados.txt"
            cat "$RUNNER_TEMP/alterados.txt"
          else
            : > "$RUNNER_TEMP/alterados.txt"
          fi
          sh infra/scripts/selecionar-testes.sh < "$RUNNER_TEMP/alterados.txt" | tee -a "$GITHUB_OUTPUT"

  # Lint e tipos em paralelo com os testes: saem do caminho crítico (T-149).
  # Não carrega o app nem o banco, então dispensa Postgres, Redis e bibliotecas do WeasyPrint.
  backend-lint:
    needs: areas
    if: needs.areas.outputs.backend == 'true'
    name: Backend (lint e tipos)
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: chave-so-para-ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .

  backend:
    needs: areas
    if: needs.areas.outputs.backend == 'true'
    name: Backend (testes, OpenAPI)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: giro
          POSTGRES_USER: giro
          POSTGRES_PASSWORD: giro-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U giro -d giro" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: chave-so-para-ci
      DATABASE_URL: postgres://giro:giro-ci@localhost:5432/giro
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Dependências do sistema (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 shared-mime-info
      - run: pip install -r requirements-dev.txt
      # xdist com um banco por worker (test_giro_gw0...). loadfile mantém cada módulo num worker só,
      # para a fixture de módulo do seed rodar uma vez. --create-db anula o --reuse-db do addopts.
      # T-427: em PR para a develop, só os testes selecionados (lista) ou nenhum; o resto roda inteiro.
      - name: Testes (${{ needs.areas.outputs.backend_testes }})
        if: needs.areas.outputs.backend_testes != 'nenhum'
        env:
          ALVOS: ${{ needs.areas.outputs.backend_alvos }}
        run: pytest -q -n auto --dist loadfile --create-db --durations=15 $ALVOS
      - name: OpenAPI gerado igual a docs/api/openapi.yaml
        run: |
          python manage.py spectacular --urlconf config.urls_openapi --file "$RUNNER_TEMP/openapi.yaml" --validate
          diff -u ../docs/api/openapi.yaml "$RUNNER_TEMP/openapi.yaml" || {
            echo "::error::docs/api/openapi.yaml desatualizado. Rode make api-schema e commite."
            exit 1
          }

  frontend:
    needs: areas
    if: needs.areas.outputs.frontend == 'true'
    name: Frontend (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      # T-429: o Vitest roda `git diff HEAD^1...HEAD`; com o checkout raso padrão (depth 1) o HEAD^1
      # não existe e o passo quebra. Profundidade 2 traz o commit de merge e a ponta da base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run api:gerar
      - run: npm run lint
      - run: npm run typecheck
      # T-427: em PR para a develop, só os testes afetados pelo diff (grafo de imports do Vitest).
      - name: Testes (${{ needs.areas.outputs.frontend_testes }})
        env:
          MODO: ${{ needs.areas.outputs.frontend_testes }}
        run: |
          if [ "$MODO" = "tudo" ]; then
            npm test -- --run
          else
            npm test -- --run --changed HEAD^1 --passWithNoTests
          fi
      - run: npm run build

  infra:
    needs: areas
    if: needs.areas.outputs.infra == 'true'
    name: Infra (Compose e .env.example)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh infra/scripts/check-env.sh
      - run: sh infra/scripts/check-selecao-testes.sh
      - run: cp .env.example .env && docker compose config --quiet
      - run: sh infra/scripts/check-migracao-so-no-worker.sh
      # Compose de produção (T-373, ADR 0033): config válido e regras de rede, segredo e backup.
      - run: sh infra/scripts/check-producao.sh
