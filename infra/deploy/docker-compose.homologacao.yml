# Homologação (T-264, ADR 0027): a imagem `producao` do backend (Gunicorn, sem root) atrás do
# proxy de infra/proxy. Banco e Redis são gerenciados e vêm por variável de ambiente
# (DATABASE_URL e companhia, em infra/deploy/homologacao.env.example); o frontend também é
# externo (FRONTEND_UPSTREAM). Uso:
#   docker compose -f infra/deploy/docker-compose.homologacao.yml --env-file <cofre>.env up -d --build
# Variáveis do compose (além das do modelo): PORTA_HTTP e PORTA_HTTPS (80 e 443 por padrão), CERT_DIR_HOST (pasta com fullchain.pem e
# privkey.pem do certificado curinga), FRONTEND_UPSTREAM (host:porta do Next) e ADMIN_IPS_ARQUIVO
# (arquivo do cofre com a lista de IPs do Django Admin; modelo em
# infra/deploy/<ambiente>.admin-ips.conf.example). SUBDOMINIO_PLATAFORMA é opcional (admin).

x-backend: &backend
  build:
    context: ../..
    dockerfile: infra/docker/backend.Dockerfile
    target: producao
  image: giro-backend:producao
  env_file: ${ENV_FILE:-homologacao.env}
  restart: unless-stopped

services:
  # Copia os estáticos do Admin para o volume que o proxy serve, a cada subida (um volume
  # nomeado só se preencheria na primeira vez e ficaria velho nas versões seguintes).
  estaticos:
    <<: *backend
    restart: "no"
    # Root só nesta cópia: o volume novo é do root e a imagem roda com o usuário giro.
    user: "0"
    entrypoint: ["sh", "-c", "cp -r /app/staticfiles/. /estaticos/"]
    environment:
      DATABASE_URL_MIGRACAO: ""
    volumes:
      - estaticos:/estaticos

  # Migra os schemas com o papel giro_migracao (ADR 0016) e sai; só então o backend sobe. O
  # backend, o worker e o beat usam giro_app, sem DDL (DATABASE_URL do cofre).
  migrar:
    <<: *backend
    restart: "no"
    environment:
      RODAR_MIGRACOES: "1"
      DATABASE_URL: ${DATABASE_URL_MIGRACAO}
    command: ["true"]

  backend:
    <<: *backend
    depends_on:
      migrar:
        condition: service_completed_successfully
    # O web não recebe a credencial com DDL, mesmo que ela esteja no arquivo de variáveis (T-352).
    environment:
      DATABASE_URL_MIGRACAO: ""
    expose:
      - "8000"
    # Sem `command`: vale o CMD da imagem, o Gunicorn com infra/docker/gunicorn.conf.py.
    stop_grace_period: 40s

  # Fila padrão (`celery`). Não lê a fila `apagamento` e não recebe a credencial de migração.
  worker:
    <<: *backend
    depends_on:
      migrar:
        condition: service_completed_successfully
    environment:
      DATABASE_URL_MIGRACAO: ""
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "-Q", "celery", "-n", "geral@%h"]
    stop_grace_period: 40s

  # Worker próprio do apagamento (T-352, T-382; mesmo desenho da produção): lê só a fila
  # `apagamento`, para onde o backend manda a aud_08_apagar_empresas (CELERY_TASK_ROUTES), e é o
  # único serviço de execução com o giro_migracao (ADR 0016 e 0025), vindo do cofre como no `migrar`.
  worker-apagamento:
    <<: *backend
    depends_on:
      migrar:
        condition: service_completed_successfully
    environment:
      DATABASE_URL_MIGRACAO: ${DATABASE_URL_MIGRACAO}
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "-Q", "apagamento", "--concurrency=1", "-n", "apagamento@%h"]
    stop_grace_period: 40s

  beat:
    <<: *backend
    depends_on:
      migrar:
        condition: service_completed_successfully
    environment:
      DATABASE_URL_MIGRACAO: ""
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]

  proxy:
    image: nginx:1.27
    restart: unless-stopped
    environment:
      DOMINIO_BASE: ${DOMINIO_BASE}
      SUBDOMINIO_PLATAFORMA: ${SUBDOMINIO_PLATAFORMA:-admin}
      BACKEND_UPSTREAM: backend:8000
      FRONTEND_UPSTREAM: ${FRONTEND_UPSTREAM}
      CERT_DIR: /etc/ssl/giro
      ESTATICOS_DIR: /estaticos
    volumes:
      - ../proxy/giro.conf.template:/etc/nginx/templates/giro.conf.template:ro
      - ../proxy/snippets:/etc/nginx/templates/snippets:ro
      # Lista de IPs do Django Admin (T-291, ADR 0029), do cofre; vazia = Admin fechado.
      - ${ADMIN_IPS_ARQUIVO}:/etc/nginx/admin-ips.conf:ro
      - ${CERT_DIR_HOST}:/etc/ssl/giro:ro
      - estaticos:/estaticos:ro
    ports:
      - "${PORTA_HTTP:-80}:80"
      - "${PORTA_HTTPS:-443}:443"
    depends_on:
      estaticos:
        condition: service_completed_successfully
      backend:
        condition: service_started

volumes:
  estaticos:
