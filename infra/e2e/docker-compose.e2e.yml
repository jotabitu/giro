# Só para o E2E (frontend/e2e): fixa a data de referência de backend, worker e beat (ADR 0021) sem editar o .env.
# Uso: E2E_DATA_REFERENCIA=2026-10-14 docker compose -f docker-compose.yml -f infra/e2e/docker-compose.e2e.yml up -d --force-recreate --no-deps backend worker beat
# Nunca entra em homologação nem produção: o prod.py recusa subir com GIRO_DATA_REFERENCIA.
services:
  backend:
    environment:
      GIRO_DATA_REFERENCIA: ${E2E_DATA_REFERENCIA:-2026-10-07}
  worker:
    environment:
      GIRO_DATA_REFERENCIA: ${E2E_DATA_REFERENCIA:-2026-10-07}
  beat:
    environment:
      GIRO_DATA_REFERENCIA: ${E2E_DATA_REFERENCIA:-2026-10-07}
