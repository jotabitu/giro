<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lançar despesa da plataforma · celular</title>
<link rel="stylesheet" href="../../design-system/wl-theme.css">
<link rel="stylesheet" href="../../design-system/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:var(--ink)}a:hover{color:var(--ink-muted)}
.co{display:flex;align-items:center;gap:12px}
.co .lg{display:grid;place-items:center;width:36px;height:36px;flex:none;border-radius:10px;font-size:12px;font-weight:700;color:#ffffff}
.mini{height:6px;width:90px;border-radius:999px;background:var(--surface-sunken);overflow:hidden}
.mini i{display:block;height:100%;border-radius:999px;background:var(--solid)}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row small,.muted{color:var(--ink-muted)}
.row small{display:block;font-size:13px;line-height:18px}
.card{padding:16px;border-radius:24px;background:var(--surface)}
.h2{margin:0;font-size:20px;font-weight:600}
.lbl{font-size:13px;color:var(--ink-muted)}
.bar{height:8px;border-radius:999px;background:var(--surface-sunken);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--solid)}
.leg{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-muted)}
.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.res{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.res:last-child{border-bottom:0}
.res.tot{font-weight:600;font-size:17px}
.sec{font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two .wl-field,.wl-field.full{width:auto;min-width:0}
.two .wl-input{width:100%;box-sizing:border-box;min-width:0}
[style*="width: 390px"] > *{flex-shrink:0}
.tabs{align-self:flex-start}
.tabs a{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;color:var(--ink);text-decoration:none;font-size:15px}
.tabs a[aria-current="page"]{background:var(--solid);color:var(--on-solid)}
.tabs .tc{font-size:13px;opacity:.7}
.tabs--m{display:grid;grid-template-columns:1fr 1fr 1fr;align-self:stretch}
.tabs--m a{justify-content:center;padding:0 10px}
.kpv{font-size:32px!important;white-space:nowrap}
.tg{position:relative;width:44px;height:26px;flex:none;border-radius:999px;background:var(--solid)}
.tg::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:var(--on-solid)}
.tg.off{background:var(--line)}
.tg.off::after{right:auto;left:3px;background:var(--surface)}
.swrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface-sunken)}
.drop{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:1.5px dashed var(--line);color:var(--ink-muted);font-size:14px}
.scrim{position:absolute;inset:0;background:rgba(17,17,20,0.38)}
.drawer{position:absolute;top:16px;right:16px;bottom:16px;width:520px;display:flex;flex-direction:column;border-radius:32px;background:var(--surface);box-shadow:var(--shadow-pop);overflow:hidden}

</style>
</helmet>
<div style="--brand: {{brand}}; --on-brand: {{onBrand}}; --brand-soft: {{brandSoft}}; position: relative; width: 390px; height: 1100px; box-sizing: border-box; padding: 16px 16px 112px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; background: var(--canvas); color: var(--ink); font-family: var(--font-sans);">
<header style="display: flex; align-items: center; gap: 12px; padding-top: 8px;"><a href="Plat-Despesas-Mobile.dc.html" aria-label="Fechar" class="wl-icon-btn wl-icon-btn--sm" style="width: 44px; height: 44px; flex: none;"><svg class="wl-i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"></path></svg></a><div style="flex: 1;"><div style="font-size: 22px; line-height: 26px; font-weight: 600;">Lançar despesa</div><div class="lbl">Despesa do Giro, não de uma empresa</div></div></header>
<section style="display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 24px; background: var(--surface);">
<div class="sec">1 · O que é</div>
<label class="wl-field full"><span class="wl-field__label">Categoria</span><select class="wl-input"><option>Infraestrutura</option><option>Ferramentas e serviços</option><option>Taxas de pagamento</option><option>Impostos</option><option>Equipe</option><option>Marketing</option><option>Outros</option></select></label>
<label class="wl-field full"><span class="wl-field__label">Descrição</span><input class="wl-input" value="Domínio e certificado curinga"></label>
<label class="wl-field full"><span class="wl-field__label">Fornecedor</span><input class="wl-input" value="Registro de domínios"></label>
<div class="sec" style="margin-top: 4px;">2 · Quanto e quando</div>
<div class="two"><label class="wl-field"><span class="wl-field__label">Valor</span><input class="wl-input" value="R$ 180,00"></label><label class="wl-field"><span class="wl-field__label">Vencimento</span><input class="wl-input" value="30/10/2026"></label></div>
<div class="swrow"><div style="flex: 1;"><div style="font-weight: 500;">Repetir todo mês</div><div class="lbl">Cria a despesa de novo no mesmo dia</div></div><span class="tg off" role="switch" aria-checked="false" aria-label="Repetir todo mês"></span></div>
<div class="swrow"><div style="flex: 1;"><div style="font-weight: 500;">Já foi paga</div><div class="lbl">Pede data e forma de pagamento</div></div><span class="tg off" role="switch" aria-checked="false" aria-label="Já foi paga"></span></div>
<div class="sec" style="margin-top: 4px;">3 · Comprovante</div>
<div class="drop"><svg class="wl-i" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"></path></svg><div style="flex: 1;"><div style="color: var(--ink); font-weight: 500;">Anexar nota ou boleto</div><div>PDF ou foto, até 10 MB · opcional</div></div></div>
</section>
<div style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; gap: 8px;"><a class="wl-btn" href="Plat-Despesas-Mobile.dc.html" style="flex: 1; justify-content: center; height: 52px; text-decoration: none;">Cancelar</a><a class="wl-btn wl-btn--solid" href="Plat-Despesas-Mobile.dc.html" style="flex: 2; justify-content: center; height: 52px; text-decoration: none;">Salvar despesa</a></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#c8f04a","options":["#c8f04a","#ff7a45","#2f6fed","#16b8a6"],"section":"White label"},"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    var b = String(this.props.brand || '#c8f04a').replace('#', '');
    if (b.length === 3) { b = b.charAt(0) + b.charAt(0) + b.charAt(1) + b.charAt(1) + b.charAt(2) + b.charAt(2); }
    var r = parseInt(b.slice(0, 2), 16), g = parseInt(b.slice(2, 4), 16), bl = parseInt(b.slice(4, 6), 16);
    function lin(c) { c = c / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
    var L = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(bl);
    var onBrand = (L + 0.05) / 0.0555 >= 1.05 / (L + 0.05) ? '#111114' : '#ffffff';
    function mix(c) { return Math.round(c + (255 - c) * 0.82); }
    return { brand: '#' + b, onBrand: onBrand, brandSoft: 'rgb(' + mix(r) + ',' + mix(g) + ',' + mix(bl) + ')' };
  }
}
</script>
</body>
</html>
