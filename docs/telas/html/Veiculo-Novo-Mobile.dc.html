<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cadastrar veículo · celular</title>
<link rel="stylesheet" href="../../design-system/wl-theme.css">
<link rel="stylesheet" href="../../design-system/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:var(--ink)}a:hover{color:var(--ink-muted)}
.card{display:flex;flex-direction:column;gap:14px;padding:18px 16px;border-radius:24px;background:var(--surface)}
.h2{margin:0;font-size:18px;line-height:24px;font-weight:600}
.wl-field{width:100%}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
select.wl-input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-muted) 50%),linear-gradient(135deg,var(--ink-muted) 50%,transparent 50%);background-position:calc(100% - 22px) 21px,calc(100% - 16px) 21px;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
.doc{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:104px;box-sizing:border-box;padding:12px;border-radius:18px;background:var(--surface-sunken);font:inherit;font-size:14px;color:var(--ink);border:0;text-align:left}
.doc small{font-size:12px;color:var(--ink-muted)}
.doc .ok{position:absolute;top:10px;right:10px;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--success);color:#ffffff}
.doc--todo{background:var(--surface);border:1.5px dashed var(--line);align-items:center;justify-content:center;text-align:center}
</style>
</helmet>
<div style="--brand: {{brand}}; --on-brand: {{onBrand}}; --brand-soft: {{brandSoft}}; position: relative; width: 390px; height: 2020px; box-sizing: border-box; padding: 16px 16px 150px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; background: var(--canvas); color: var(--ink); font-family: var(--font-sans);">

<header style="display: flex; align-items: center; gap: 12px; padding-top: 8px;">
<a href="Frota-Mobile.dc.html" aria-label="Voltar" class="wl-icon-btn" style="width: 44px; height: 44px;"><svg class="wl-i" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"></path></svg></a>
<div style="flex: 1; font-size: 22px; line-height: 26px; font-weight: 600;">Cadastrar veículo</div>
</header>

<div class="wl-seg" role="group" aria-label="Tipo de veículo" style="display: grid; grid-template-columns: 1fr 1fr; background: var(--surface);"><button aria-pressed="true">Moto</button><button aria-pressed="false">Carro</button></div>

<button class="doc" style="height: auto; flex-direction: row; align-items: center; gap: 12px; padding: 14px 16px; background: var(--surface);"><svg class="wl-i" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg><span style="flex: 1;">Fotografar o CRLV para preencher<small style="display: block;">Lido agora · 9 campos preenchidos</small></span><span class="ok" style="position: static;"><svg class="wl-i" viewBox="0 0 24 24" style="width: 15px; height: 15px; stroke-width: 2.5;"><path d="m5 12 5 5 9-10"></path></svg></span></button>

<section class="card">
<h2 class="h2">Identificação</h2>
<label class="wl-field"><span class="wl-field__label">Placa</span><input class="wl-input wl-mono" value="TBC-5H21"></label>
<div class="two">
<label class="wl-field"><span class="wl-field__label">Marca</span><select class="wl-input"><option>Honda</option></select></label>
<label class="wl-field"><span class="wl-field__label">Ano</span><input class="wl-input wl-mono" value="2026 / 2026" style="font-size: 13px; padding: 0 12px;"></label>
</div>
<label class="wl-field"><span class="wl-field__label">Modelo</span><input class="wl-input" value="Pop 110i ES"></label>
<label class="wl-field"><span class="wl-field__label">Chassi</span><input class="wl-input wl-mono" value="9C2JC7500TR012345"><span class="wl-field__hint">17 caracteres</span></label>
<div class="two">
<label class="wl-field"><span class="wl-field__label">Renavam</span><input class="wl-input wl-mono" value="01398765432" style="font-size: 13px; padding: 0 12px;"></label>
<label class="wl-field"><span class="wl-field__label">Km atual</span><input class="wl-input wl-mono" value="0" style="font-size: 13px; padding: 0 12px;"></label>
</div>
</section>

<section class="card">
<h2 class="h2">Uso na frota</h2>
<div class="two">
<label class="wl-field"><span class="wl-field__label">Filial</span><select class="wl-input"><option>Centro</option></select></label>
<label class="wl-field"><span class="wl-field__label">Finalidade</span><select class="wl-input"><option>Locação</option></select></label>
</div>
<label class="wl-field"><span class="wl-field__label">Categoria de preço</span><select class="wl-input"><option>Urbana 110–125</option></select></label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; font-size: 14px;">
<div style="padding: 10px 12px; border-radius: 14px; background: var(--surface-sunken);"><span style="color: var(--ink-muted);">Diária</span><br><b>R$ 44,90</b></div>
<div style="padding: 10px 12px; border-radius: 14px; background: var(--surface-sunken);"><span style="color: var(--ink-muted);">Semanal</span><br><b>R$ 299,40</b></div>
<div style="padding: 10px 12px; border-radius: 14px; background: var(--surface-sunken);"><span style="color: var(--ink-muted);">Mensal</span><br><b>R$ 1.090</b></div>
<div style="padding: 10px 12px; border-radius: 14px; background: var(--surface-sunken);"><span style="color: var(--ink-muted);">Caução</span><br><b>R$ 300,00</b></div>
</div>
</section>

<section class="card">
<h2 class="h2">Compra</h2>
<div class="two">
<label class="wl-field"><span class="wl-field__label">Origem</span><select class="wl-input"><option>Compra</option></select></label>
<label class="wl-field"><span class="wl-field__label">Data</span><input class="wl-input wl-mono" value="08/10/2026" style="font-size: 13px; padding: 0 12px;"></label>
</div>
<div class="two">
<label class="wl-field"><span class="wl-field__label">Valor de compra</span><input class="wl-input" value="R$ 13.490,00" style="font-size: 13px; padding: 0 12px;"></label>
<label class="wl-field"><span class="wl-field__label">FIPE</span><input class="wl-input" value="R$ 13.900,00" style="font-size: 13px; padding: 0 12px;"></label>
</div>
</section>

<section class="card">
<h2 class="h2">Documentos e fotos</h2>
<div class="two">
<label class="wl-field"><span class="wl-field__label">CRLV até</span><input class="wl-input wl-mono" value="31/10/2027" style="font-size: 13px; padding: 0 12px;"></label>
<label class="wl-field"><span class="wl-field__label">Seguro até</span><input class="wl-input" value="" style="font-size: 13px; padding: 0 12px;"></label>
</div>
<div class="two">
<button class="doc"><span class="ok"><svg class="wl-i" viewBox="0 0 24 24" style="width: 15px; height: 15px; stroke-width: 2.5;"><path d="m5 12 5 5 9-10"></path></svg></span>CRLV-e<small>enviado</small></button>
<button class="doc"><span class="ok"><svg class="wl-i" viewBox="0 0 24 24" style="width: 15px; height: 15px; stroke-width: 2.5;"><path d="m5 12 5 5 9-10"></path></svg></span>Nota fiscal<small>enviada</small></button>
<button class="doc"><span class="ok"><svg class="wl-i" viewBox="0 0 24 24" style="width: 15px; height: 15px; stroke-width: 2.5;"><path d="m5 12 5 5 9-10"></path></svg></span>4 fotos<small>frente, traseira, lados</small></button>
<button class="doc doc--todo"><svg class="wl-i" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Foto do painel</button>
<button class="doc doc--todo" style="grid-column: span 2;"><svg class="wl-i" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Apólice do seguro</button>
</div>
</section>

<div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 28px; background: var(--canvas); border-top: 1px solid var(--line);">
<div style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 18px; color: var(--warning-ink);"><svg class="wl-i" viewBox="0 0 24 24" style="width: 16px; height: 16px;"><path d="M12 4l9 16H3z"></path><path d="M12 10v4M12 17v.5"></path></svg><span>Sem seguro e foto do painel, entra como Indisponível.</span></div>
<a class="wl-btn wl-btn--solid" href="Veiculo-Mobile.dc.html" style="height: 56px; text-decoration: none;">Salvar veículo</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#c8f04a","options":["#c8f04a","#ff7a45","#2f6fed","#16b8a6"],"section":"White label"},"$preview":{"width":390,"height":2020}}'>
class Component extends DCLogic {
  renderVals() {
    var b = String(this.props.brand || '#c8f04a').replace('#', '');
    if (b.length === 3) { b = b.charAt(0) + b.charAt(0) + b.charAt(1) + b.charAt(1) + b.charAt(2) + b.charAt(2); }
    var r = parseInt(b.slice(0, 2), 16), g = parseInt(b.slice(2, 4), 16), bl = parseInt(b.slice(4, 6), 16);
    function lin(c) { c = c / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
    var L = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(bl);
    var onBrand = (L + 0.05) / 0.0555 >= 1.05 / (L + 0.05) ? '#111114' : '#ffffff';
    function mix(c) { return Math.round(c + (255 - c) * 0.82); }
    return { brand: '#' + b, onBrand: onBrand, brandSoft: 'rgb(' + mix(r) + ',' + mix(g) + ',' + mix(bl) + ')' };
  }
}
</script>
</body>
</html>
