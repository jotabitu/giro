<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Assistente · o que a empresa faz · celular</title>
<link rel="stylesheet" href="../../design-system/wl-theme.css">
<link rel="stylesheet" href="../../design-system/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:var(--ink)}a:hover{color:var(--ink-muted)}
.sub{margin:0 0 10px 4px;font-size:17px;line-height:22px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1.5px solid var(--line);border-radius:20px;background:var(--surface);font:inherit;font-size:15px;color:var(--ink);text-align:left}
.opt .box{display:grid;place-items:center;width:24px;height:24px;flex:none;border-radius:8px;border:1.5px solid var(--line);color:transparent}
.opt[aria-pressed="true"]{border-color:var(--solid);box-shadow:inset 0 0 0 1px var(--solid)}
.opt[aria-pressed="true"] .box{background:var(--solid);border-color:var(--solid);color:var(--on-solid)}
.opt small{display:block;margin-top:2px;font-size:13px;line-height:18px;color:var(--ink-muted)}
</style>
</helmet>
<div style="--brand: {{brand}}; --on-brand: {{onBrand}}; --brand-soft: {{brandSoft}}; position: relative; width: 390px; height: 1600px; box-sizing: border-box; padding: 16px 16px 130px; display: flex; flex-direction: column; gap: 16px; overflow: hidden; background: var(--canvas); color: var(--ink); font-family: var(--font-sans);">

<header style="display: flex; align-items: center; gap: 10px; padding-top: 8px;">
<div class="wl-logo-slot" style="width: 34px; height: 34px; border-radius: 10px; font-size: 13px;">MR</div>
<span style="flex: 1; font-size: 15px; font-weight: 600;">Moto Rápida</span>
<button class="wl-btn wl-btn--sm">Sair</button>
</header>

<div>
<div style="display: flex; justify-content: space-between; font-size: 14px; color: var(--ink-muted);"><span>Passo 3 de 8</span><span>Tabela de preços a seguir</span></div>
<div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; margin-top: 8px;">
<div style="height: 6px; border-radius: 999px; background: var(--solid);"></div>
<div style="height: 6px; border-radius: 999px; background: var(--solid);"></div>
<div style="height: 6px; border-radius: 999px; background: var(--brand);"></div>
<div style="height: 6px; border-radius: 999px; background: var(--line);"></div>
<div style="height: 6px; border-radius: 999px; background: var(--line);"></div>
<div style="height: 6px; border-radius: 999px; background: var(--line);"></div>
<div style="height: 6px; border-radius: 999px; background: var(--line);"></div>
<div style="height: 6px; border-radius: 999px; background: var(--line);"></div>
</div>
</div>

<div style="padding: 4px 4px 0;">
<h1 style="margin: 0; font-size: 28px; line-height: 32px; font-weight: 600; letter-spacing: -0.02em;">O que a Moto Rápida faz?</h1>
<p style="margin: 8px 0 0; font-size: 15px; line-height: 22px; color: var(--ink-muted);">Ligamos só o que você usa. Dá para mudar depois.</p>
</div>

<div>
<h2 class="sub">Atividades</h2>
<div class="opts">
<sc-for list="{{atividades}}" as="item" hint-placeholder-count="2">
<button class="opt" aria-pressed="{{item.pressed}}" onClick="{{item.toggle}}"><span class="box"><svg class="wl-i" viewBox="0 0 24 24" style="width: 15px; height: 15px; stroke-width: 2.5;"><path d="m5 12 5 5 9-10"></path></svg></span><span><span style="font-weight: 500;">{{item.label}}</span><small>{{item.desc}}</small></span></button>
</sc-for>
</div>
</div>

<div>
<h2 class="sub">Tipos de veículo</h2>
<div class="opts" style="display: grid; grid-template-columns: 1fr 1fr;">
<sc-for list="{{tipos}}" as="item" hint-placeholder-count="2">
<button class="opt" aria-pressed="{{item.pressed}}" onClick="{{item.toggle}}"><span class="box"><svg class="wl-i" viewBox="0 0 24 24" style="width: 15px; height: 15px; stroke-width: 2.5;"><path d="m5 12 5 5 9-10"></path></svg></span><span style="font-weight: 500;">{{item.label}}</span></button>
</sc-for>
</div>
</div>

<sc-if value="{{temLocacao}}" hint-placeholder-val="{{true}}">
<div>
<h2 class="sub">Como você aluga</h2>
<div class="opts">
<sc-for list="{{modalidades}}" as="item" hint-placeholder-count="4">
<button class="opt" aria-pressed="{{item.pressed}}" onClick="{{item.toggle}}"><span class="box"><svg class="wl-i" viewBox="0 0 24 24" style="width: 15px; height: 15px; stroke-width: 2.5;"><path d="m5 12 5 5 9-10"></path></svg></span><span><span style="font-weight: 500;">{{item.label}}</span><small>{{item.desc}}</small></span></button>
</sc-for>
</div>
</div>
</sc-if>

<div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 20px; background: var(--surface-sunken); font-size: 14px; line-height: 20px;">
<span class="wl-badge wl-badge--sm wl-badge--solid">{{totalOn}} de 9</span>
<span style="color: var(--ink-muted);">módulos ligados · CNH: {{cnhCurta}}</span>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; padding: 14px 16px 28px; background: var(--canvas); border-top: 1px solid var(--line);">
<a class="wl-btn" href="Onboarding-Filial-Mobile.dc.html" style="height: 56px; text-decoration: none;">Voltar</a>
<a class="wl-btn wl-btn--solid" href="Onboarding-Precos-Mobile.dc.html" style="flex: 1; height: 56px; text-decoration: none;">Continuar</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#c8f04a","options":["#c8f04a","#ff7a45","#2f6fed","#16b8a6"],"section":"White label"},"$preview":{"width":390,"height":1600}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var b = String(this.props.brand || '#c8f04a').replace('#', '');
    if (b.length === 3) { b = b.charAt(0) + b.charAt(0) + b.charAt(1) + b.charAt(1) + b.charAt(2) + b.charAt(2); }
    var r = parseInt(b.slice(0, 2), 16), g = parseInt(b.slice(2, 4), 16), bl = parseInt(b.slice(4, 6), 16);
    function lin(c) { c = c / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
    var L = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(bl);
    var onBrand = (L + 0.05) / 0.0555 >= 1.05 / (L + 0.05) ? '#111114' : '#ffffff';
    function mix(c) { return Math.round(c + (255 - c) * 0.82); }
    var s = (this.state && this.state.sel) || { locacao: true, venda: true, motos: true, carros: false, diaria: true, semanal: true, mensal: true, entregador: true };
    function opt(key, label, desc) {
      return {
        label: label, desc: desc, pressed: s[key] ? 'true' : 'false',
        toggle: function () { var n = Object.assign({}, s); n[key] = !n[key]; self.setState({ sel: n }); }
      };
    }
    var recorrente = s.locacao && (s.semanal || s.mensal || s.entregador);
    var flags = [true, !!s.locacao, !!s.locacao, !!recorrente, !!s.venda, !!s.venda, !!s.venda, true, true];
    var on = flags.filter(function (f) { return f; }).length;
    var cnh = s.motos && s.carros ? 'A e B' : (s.carros ? 'B' : (s.motos ? 'A' : '—'));
    return {
      brand: '#' + b, onBrand: onBrand, brandSoft: 'rgb(' + mix(r) + ',' + mix(g) + ',' + mix(bl) + ')',
      atividades: [opt('locacao', 'Locação', 'Aluguel por dia, semana ou mês'), opt('venda', 'Venda de veículos', 'Novos, seminovos e consignados')],
      tipos: [opt('motos', 'Motos', ''), opt('carros', 'Carros', '')],
      modalidades: [opt('diaria', 'Diária', 'Turistas e uso eventual'), opt('semanal', 'Semanal', 'Cobrança toda semana'), opt('mensal', 'Mensal', 'Contratos de 30 dias ou mais'), opt('entregador', 'Entregadores e apps', 'Plano semanal com opção de compra')],
      temLocacao: !!s.locacao,
      totalOn: on,
      cnhCurta: cnh
    };
  }
}
</script>
</body>
</html>
