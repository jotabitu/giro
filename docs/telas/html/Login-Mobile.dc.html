<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Login · celular</title>
<link rel="stylesheet" href="../../design-system/wl-theme.css">
<link rel="stylesheet" href="../../design-system/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:var(--ink)}a:hover{color:var(--ink-muted)}
</style>
</helmet>
<div style="--brand: {{brand}}; --on-brand: {{onBrand}}; --brand-soft: {{brandSoft}}; width: 390px; height: 844px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden; background: var(--canvas); color: var(--ink); font-family: var(--font-sans);">

<section style="position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; height: 248px; box-sizing: border-box; padding: 24px; border-radius: 28px; background: var(--brand); color: var(--on-brand);">
<div style="display: flex; align-items: center; gap: 12px;"><div class="wl-logo-slot" aria-hidden="true">MR</div><span style="font-size: 18px; font-weight: 600;">Moto Rápida</span></div>
<p style="margin: 0; font-size: 28px; line-height: 32px; font-weight: 600; letter-spacing: -0.02em;">Sua frota, seus contratos e seu caixa no mesmo lugar.</p>
</section>

<form style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 24px 20px; border-radius: 28px; background: var(--surface);">
<h1 style="margin: 0; font-size: 28px; line-height: 32px; font-weight: 600; letter-spacing: -0.02em;">Entrar</h1>
<label class="wl-field" style="width: 100%;"><span class="wl-field__label">E-mail</span><input class="wl-input" type="email" placeholder="voce@empresa.com.br"></label>
<label class="wl-field" style="width: 100%;"><span class="wl-field__label">Senha</span><input class="wl-input" type="password" placeholder="Sua senha"></label>
<a href="Esqueci-Senha-Mobile.dc.html" style="align-self: flex-end; font-size: 14px; font-weight: 500; text-decoration: none;">Esqueci a senha</a>
<a class="wl-btn wl-btn--solid" href="Dashboard-Mobile.dc.html" style="width: 100%; box-sizing: border-box; height: 52px; margin-top: auto; text-decoration: none;">Entrar</a>
<span style="text-align: center; font-size: 13px; color: var(--ink-muted);">Tecnologia Giro</span>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#c8f04a","options":["#c8f04a","#ff7a45","#2f6fed","#16b8a6"],"section":"White label"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var b = String(this.props.brand || '#c8f04a').replace('#', '');
    if (b.length === 3) { b = b.charAt(0) + b.charAt(0) + b.charAt(1) + b.charAt(1) + b.charAt(2) + b.charAt(2); }
    var r = parseInt(b.slice(0, 2), 16), g = parseInt(b.slice(2, 4), 16), bl = parseInt(b.slice(4, 6), 16);
    function lin(c) { c = c / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
    var L = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(bl);
    var onBrand = (L + 0.05) / 0.0555 >= 1.05 / (L + 0.05) ? '#111114' : '#ffffff';
    function mix(c) { return Math.round(c + (255 - c) * 0.82); }
    return { brand: '#' + b, onBrand: onBrand, brandSoft: 'rgb(' + mix(r) + ',' + mix(g) + ',' + mix(bl) + ')' };
  }
}
</script>
</body>
</html>
