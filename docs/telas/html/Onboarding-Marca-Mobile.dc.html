<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Assistente · marca · celular</title>
<link rel="stylesheet" href="../../design-system/wl-theme.css">
<link rel="stylesheet" href="../../design-system/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:var(--ink)}a:hover{color:var(--ink-muted)}
.card{display:flex;flex-direction:column;gap:14px;padding:18px 16px;border-radius:24px;background:var(--surface)}
.wl-field{width:100%}
.sw{width:44px;height:44px;border-radius:50%;border:0}
.mini-nav{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:999px;font-size:13px}
</style>
</helmet>
<div style="--brand: {{brand}}; --on-brand: {{onBrand}}; --brand-soft: {{brandSoft}}; position: relative; width: 390px; height: 1500px; box-sizing: border-box; padding: 16px 16px 120px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; background: var(--canvas); color: var(--ink); font-family: var(--font-sans);">

<header style="display: flex; align-items: center; gap: 12px; padding-top: 8px;">
<span style="display: inline-flex; align-items: center; height: 22px; color: var(--ink);"><svg viewBox="0 0 439 120" height="17" width="62" fill="currentColor" role="img" aria-label="Giro"><path fill-rule="evenodd" d="M123.0 60.0 A61.5 61.5 0 1 1 104.99 16.51 L88.02 33.48 A37.5 37.5 0 1 0 99.0 60.0 Z M146 0 H170 V120 H146 Z M196 0 H252 A36 36 0 0 1 252 84 H220 V120 H196 Z M220 24 V60 H252 A12 12 0 0 0 252 24 Z M226 84 H260 L296 120 H262 Z M316.0 60 A61.5 61.5 0 1 1 439.0 60 A61.5 61.5 0 1 1 316.0 60 Z M340.0 60 A37.5 37.5 0 1 0 415.0 60 A37.5 37.5 0 1 0 340.0 60 Z"/><path d="M65.5 59 H123.0 V81 H65.5 Z"/></svg></span>
<button class="wl-btn wl-btn--sm">Sair</button>
</header>

<div>
<div style="display: flex; justify-content: space-between; font-size: 14px; color: var(--ink-muted);"><span>Passo 1 de 8</span><span>Primeira filial a seguir</span></div>
<div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; margin-top: 8px;">
<div style="height: 6px; border-radius: 999px; background: var(--brand);"></div>
<div style="height: 6px; border-radius: 999px; background: var(--line);"></div>
<div style="height: 6px; border-radius: 999px; background: var(--line);"></div>
<div style="height: 6px; border-radius: 999px; background: var(--line);"></div>
<div style="height: 6px; border-radius: 999px; background: var(--line);"></div>
<div style="height: 6px; border-radius: 999px; background: var(--line);"></div>
<div style="height: 6px; border-radius: 999px; background: var(--line);"></div>
<div style="height: 6px; border-radius: 999px; background: var(--line);"></div>
</div>
</div>

<div style="padding: 4px 4px 0;">
<h1 style="margin: 0; font-size: 28px; line-height: 32px; font-weight: 600; letter-spacing: -0.02em;">Sua empresa e sua marca</h1>
<p style="margin: 8px 0 0; font-size: 15px; color: var(--ink-muted);">Encontramos os dados pelo CNPJ. Confira e escolha como o sistema vai aparecer.</p>
</div>

<section class="card">
<label class="wl-field"><span class="wl-field__label">CNPJ</span><input class="wl-input wl-mono" value="12.345.678/0001-95"></label>
<label class="wl-field"><span class="wl-field__label">Nome fantasia</span><input class="wl-input" value="Moto Rápida"></label>
<label class="wl-field"><span class="wl-field__label">Endereço de acesso</span><input class="wl-input wl-mono" value="motorapida" style="font-size: 14px;"><span class="wl-field__hint">motorapida.girolocadoras.com.br</span></label>
</section>

<section class="card">
<div class="wl-field__label">Logo</div>
<div style="display: flex; align-items: center; gap: 14px;">
<div class="wl-logo-slot" style="width: 60px; height: 60px; border-radius: 18px; font-size: 20px;">MR</div>
<button class="wl-btn wl-btn--sm" style="flex: 1; height: 48px; border: 1.5px dashed var(--line);"><svg class="wl-i" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Foto ou arquivo</button>
</div>
<div class="wl-field__label" style="margin-top: 4px;">Cor de destaque</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px;">
<sc-for list="{{swatches}}" as="item" hint-placeholder-count="6">
<button class="sw" aria-label="{{item.label}}" aria-pressed="{{item.pressed}}" onClick="{{item.pick}}" style="background: {{item.hex}}; box-shadow: {{item.ring}};"></button>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 10px;">
<div style="font-size: 14px; color: var(--ink-muted); padding-left: 4px;">Pré-visualização</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 28px; background: var(--surface-sunken);">
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 20px; background: var(--surface);"><div class="wl-logo-slot" style="width: 32px; height: 32px; border-radius: 9px; font-size: 12px;">MR</div><span style="font-weight: 600; font-size: 15px;">Moto Rápida</span><span class="wl-badge wl-badge--brand wl-badge--sm" style="margin-left: auto;">7 pendências</span></div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
<div class="wl-kpi wl-kpi--solid" style="padding: 12px 14px;"><div class="wl-kpi__label" style="font-size: 13px;">Alugados</div><div class="wl-kpi__value" style="font-size: 28px; line-height: 30px; margin-bottom: 0;">42</div></div>
<div class="wl-kpi" style="padding: 12px 14px; background: var(--surface);"><div class="wl-kpi__label" style="font-size: 13px;">Ocupação</div><div class="wl-kpi__value" style="font-size: 28px; line-height: 30px; margin-bottom: 0;">71%</div></div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 8px; border-radius: 999px; background: var(--surface);">
<span class="mini-nav" style="background: var(--solid); color: var(--on-solid);">Início</span>
<span style="display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--brand); color: var(--on-brand);"><svg class="wl-i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg></span>
<span class="mini-nav" style="color: var(--ink-muted);">Financeiro</span>
</div>
</div>
</section>

<div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; padding: 14px 16px 28px; background: var(--canvas); border-top: 1px solid var(--line);">
<button class="wl-btn" style="height: 56px;">Pular</button>
<a class="wl-btn wl-btn--solid" href="Onboarding-Filial-Mobile.dc.html" style="flex: 1; height: 56px; text-decoration: none;">Continuar</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#c8f04a","options":["#c8f04a","#ff7a45","#2f6fed","#16b8a6"],"section":"White label"},"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var picked = (this.state && this.state.picked) || this.props.brand || '#c8f04a';
    var b = String(picked).replace('#', '');
    if (b.length === 3) { b = b.charAt(0) + b.charAt(0) + b.charAt(1) + b.charAt(1) + b.charAt(2) + b.charAt(2); }
    var r = parseInt(b.slice(0, 2), 16), g = parseInt(b.slice(2, 4), 16), bl = parseInt(b.slice(4, 6), 16);
    function lin(c) { c = c / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
    var L = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(bl);
    var onBrand = (L + 0.05) / 0.0555 >= 1.05 / (L + 0.05) ? '#111114' : '#ffffff';
    function mix(c) { return Math.round(c + (255 - c) * 0.82); }
    var hex = '#' + b.toLowerCase();
    var opts = [
      { hex: '#c8f04a', label: 'Verde-limão' },
      { hex: '#ff7a45', label: 'Laranja' },
      { hex: '#2f6fed', label: 'Azul' },
      { hex: '#16b8a6', label: 'Verde-água' },
      { hex: '#e11d48', label: 'Vermelho' },
      { hex: '#7a5af8', label: 'Roxo' }
    ];
    var swatches = opts.map(function (o) {
      var on = o.hex === hex;
      return {
        hex: o.hex,
        label: o.label,
        pressed: on ? 'true' : 'false',
        ring: on ? '0 0 0 3px var(--surface), 0 0 0 5px var(--ink)' : 'inset 0 0 0 1px rgba(17,17,20,0.08)',
        pick: function () { self.setState({ picked: o.hex }); }
      };
    });
    return { brand: hex, onBrand: onBrand, brandSoft: 'rgb(' + mix(r) + ',' + mix(g) + ',' + mix(bl) + ')', swatches: swatches };
  }
}
</script>
</body>
</html>
