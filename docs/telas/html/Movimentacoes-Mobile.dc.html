<style>
body{margin:0}
a{color:var(--ink)}a:hover{color:var(--ink-muted)}
.vrow{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:24px;background:var(--surface);text-decoration:none;color:var(--ink)}
.vtop{display:flex;align-items:center;gap:12px}
.thumb{display:grid;place-items:center;width:48px;height:48px;flex:none;border-radius:14px;background:var(--surface-sunken);color:var(--ink-muted)}
.vfacts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);padding-top:10px;font-size:14px}
.vfacts span{display:block;font-size:13px;color:var(--ink-muted)}
.chip{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 6px 0 14px;border:0;border-radius:999px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;white-space:nowrap}
.chip .wl-count{min-width:24px;height:24px;padding:0 7px}
.chip[aria-pressed="true"]{background:var(--solid);color:var(--on-solid)}
.chip[aria-pressed="true"] .wl-count{background:var(--brand);color:var(--on-brand)}
.lbl{font-size:13px;color:var(--ink-muted)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:28px;background:var(--surface)}
.col-head{display:flex;align-items:center;gap:8px;padding:4px 6px 6px;font-weight:600;font-size:16px}
.col-head .dot{width:10px;height:10px;border-radius:50%}
.col-head .wl-count{margin-left:auto}
.mv{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:20px;background:var(--surface-sunken)}
.mv .t{font-weight:600;font-size:15px}
.mv .p{font-size:13px;line-height:18px}
.mv .m{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-muted)}
.mv .m span{display:inline-flex;align-items:center;gap:4px}
.mv .f{display:flex;align-items:center;gap:8px;margin-top:2px}
.mv .f b{margin-left:auto;font-size:13px;font-weight:600;white-space:nowrap}
.mv .lbl.wl-mono{white-space:nowrap}
.mv.now{background:var(--solid);color:var(--on-solid)}
.mv.now .m,.mv.now .lbl{color:var(--on-solid-muted)}
.add{display:flex;align-items:center;justify-content:center;gap:6px;height:42px;border-radius:16px;border:1.5px dashed var(--line);font-size:14px;color:var(--ink-muted)}
.mcols{display:flex;align-items:flex-start;gap:12px;margin:0 -16px;padding:0 16px;overflow:hidden}
.mcols .col{flex:0 0 300px}
.tabs{display:flex;gap:8px;overflow:hidden}
.tab{border:0;font:inherit;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;background:var(--surface);font-size:14px;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--solid);color:var(--on-solid)}
</style>

<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#c8f04a","options":["#c8f04a","#ff7a45","#2f6fed","#16b8a6"],"section":"White label"},"$preview":{"width":390,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    var b = String(this.props.brand || '#c8f04a').replace('#', '');
    if (b.length === 3) { b = b.charAt(0) + b.charAt(0) + b.charAt(1) + b.charAt(1) + b.charAt(2) + b.charAt(2); }
    var r = parseInt(b.slice(0, 2), 16), g = parseInt(b.slice(2, 4), 16), bl = parseInt(b.slice(4, 6), 16);
    function lin(c) { c = c / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
    var L = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(bl);
    var onBrand = (L + 0.05) / 0.0555 >= 1.05 / (L + 0.05) ? '#111114' : '#ffffff';
    function mix(c) { return Math.round(c + (255 - c) * 0.82); }
    return { brand: '#' + b, onBrand: onBrand, brandSoft: 'rgb(' + mix(r) + ',' + mix(g) + ',' + mix(bl) + ')' };
  }
}
</script>
