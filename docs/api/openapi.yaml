components:
  schemas:
    Aberto:
      type: object
      properties:
        grupo:
          type: string
        quantidade:
          type: integer
        texto:
          type: string
      required:
      - grupo
      - quantidade
      - texto
    AbrirAcesso:
      type: object
      properties:
        motivo:
          type: string
          maxLength: 500
        chamado_id:
          type: integer
          nullable: true
        duracao_minutos:
          $ref: '#/components/schemas/DuracaoMinutosEnum'
        permissao:
          $ref: '#/components/schemas/PermissaoSuporteEnum'
      required:
      - duracao_minutos
      - motivo
      - permissao
    AbrirCaixa:
      type: object
      properties:
        troco_centavos:
          type: integer
          minimum: 0
      required:
      - troco_centavos
    AcaoAgenda:
      type: object
      properties:
        codigo:
          type: string
          description: iniciar, continuar, abrir
        rotulo:
          type: string
      required:
      - codigo
      - rotulo
    AcaoDaImplantacao:
      type: object
      properties:
        rotulo:
          type: string
        destino:
          $ref: '#/components/schemas/DestinoEnum'
        passo:
          type: string
      required:
      - destino
      - rotulo
    AcaoDoPasso:
      type: object
      properties:
        rotulo:
          type: string
        destino:
          type: string
      required:
      - destino
      - rotulo
    AcaoEnum:
      enum:
      - baixar
      - ignorar
      type: string
      description: |-
        * `baixar` - Baixar
        * `ignorar` - Ignorar
    AcaoLocacao:
      type: object
      properties:
        codigo:
          type: string
        rotulo:
          type: string
      required:
      - codigo
      - rotulo
    AcaoPrincipalCliente:
      type: object
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoEnum'
        rotulo:
          type: string
        alvo:
          allOf:
          - $ref: '#/components/schemas/AlvoCliente'
          nullable: true
      required:
      - alvo
      - codigo
      - rotulo
    Access:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    AccessDaEmpresa:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    AceitarConvite:
      type: object
      properties:
        token:
          type: string
          maxLength: 100
        nome:
          type: string
          maxLength: 150
        senha:
          type: string
        aparelho:
          allOf:
          - $ref: '#/components/schemas/TipoSessaoEnum'
          default: desktop
      required:
      - senha
      - token
    AceitarConviteDaEquipe:
      type: object
      properties:
        token:
          type: string
          maxLength: 100
        senha:
          type: string
      required:
      - senha
      - token
    AceitarConviteResposta:
      oneOf:
      - $ref: '#/components/schemas/Pronto'
      - $ref: '#/components/schemas/EtapaDoLogin'
    Acerto:
      type: object
      properties:
        status:
          type: string
          description: rascunho, concluido
        caucao_centavos:
          type: integer
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemAcerto'
        creditos:
          type: array
          items:
            $ref: '#/components/schemas/ItemAcerto'
        total_cobrancas_centavos:
          type: integer
        total_creditos_centavos:
          type: integer
        saldo_centavos:
          type: integer
        resultado:
          $ref: '#/components/schemas/ResultadoAcerto'
        avisos:
          type: array
          items:
            $ref: '#/components/schemas/AvisoAcerto'
          description: Vazia quando a devolução não é antecipada, já tem a aprovação
            ou o acerto está concluído.
        forma_devolucao:
          type: string
          nullable: true
      required:
      - avisos
      - caucao_centavos
      - creditos
      - forma_devolucao
      - itens
      - resultado
      - saldo_centavos
      - status
      - total_cobrancas_centavos
      - total_creditos_centavos
    AcessoAberto:
      type: object
      properties:
        acesso_suporte_id:
          type: integer
        fim:
          type: string
          format: date-time
        url_entrada:
          type: string
      required:
      - acesso_suporte_id
      - fim
      - url_entrada
    AcessoDaLista:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        motivo:
          type: string
        permissao:
          $ref: '#/components/schemas/PermissaoSuporteEnum'
        inicio:
          type: string
          format: date-time
        fim:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/AcessoDaListaStatusEnum'
      required:
      - fim
      - id
      - inicio
      - motivo
      - nome
      - permissao
      - status
    AcessoDaListaStatusEnum:
      enum:
      - ativo
      - encerrado
