          description: ''
  /api/filiais/{id}/reativar/:
    post:
      operationId: filiais_reativar_create
      summary: Reativar (PLT-03)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - filiais
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Motivo'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Motivo'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Motivo'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filial'
          description: ''
  /api/filiais/{id}/tornar-matriz/:
    post:
      operationId: filiais_tornar_matriz_create
      summary: Tornar matriz (FIL-01)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - filiais
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filial'
          description: ''
  /api/filiais/minhas/:
    get:
      operationId: filiais_minhas_retrieve
      summary: Seletor de filial (USR-07)
      tags:
      - filiais
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinhasFiliais'
          description: ''
  /api/plataforma/auth/2fa/configurar/:
    post:
      operationId: plataforma_auth_2fa_configurar_create
      summary: Novo autenticador (PLT-08)
      tags:
      - plataforma
      security:
      - jwtPre2fa: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configurar2FA'
          description: ''
  /api/plataforma/auth/2fa/verificar/:
    post:
      operationId: plataforma_auth_2fa_verificar_create
      summary: Confirmar o código (PLT-08)
      tags:
      - plataforma
      requestBody:
        content:
          application/json:
            schema:
