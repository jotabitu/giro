components:
  schemas:
    AbrirAcesso:
      type: object
      properties:
        motivo:
          type: string
          maxLength: 500
        chamado_id:
          type: integer
          nullable: true
        duracao_minutos:
          $ref: '#/components/schemas/DuracaoMinutosEnum'
        permissao:
          $ref: '#/components/schemas/PermissaoSuporteEnum'
      required:
      - duracao_minutos
      - motivo
      - permissao
    Access:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    AccessDaEmpresa:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    AceitarConvite:
      type: object
      properties:
        token:
          type: string
          maxLength: 100
        nome:
          type: string
          maxLength: 150
        senha:
          type: string
        aparelho:
          allOf:
          - $ref: '#/components/schemas/TipoSessaoEnum'
          default: desktop
      required:
      - senha
      - token
    AceitarConviteDaEquipe:
      type: object
      properties:
        token:
          type: string
          maxLength: 100
        senha:
          type: string
      required:
      - senha
      - token
    AceitarConviteResposta:
      oneOf:
      - $ref: '#/components/schemas/Pronto'
      - $ref: '#/components/schemas/EtapaDoLogin'
    AcessoAberto:
      type: object
      properties:
        acesso_suporte_id:
          type: integer
        fim:
          type: string
          format: date-time
        url_entrada:
          type: string
      required:
      - acesso_suporte_id
      - fim
      - url_entrada
    AcessoDaLista:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        motivo:
          type: string
        permissao:
          $ref: '#/components/schemas/PermissaoSuporteEnum'
        inicio:
          type: string
          format: date-time
        fim:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/AcessoDaListaStatusEnum'
      required:
      - fim
      - id
      - inicio
      - motivo
      - nome
      - permissao
      - status
    AcessoDaListaStatusEnum:
      enum:
      - ativo
      - encerrado
      - revogado
      type: string
      description: |-
        * `ativo` - Ativo
        * `encerrado` - Encerrado
        * `revogado` - Revogado
    Acoes:
      type: object
      properties:
        entrar_como_suporte:
          type: boolean
        estender_teste:
          type: boolean
        mudar_plano:
          type: boolean
        suspender:
          type: boolean
      required:
      - entrar_como_suporte
      - estender_teste
      - mudar_plano
      - suspender
    AcoesDoVeiculo:
      type: object
      properties:
        editar:
          type: boolean
        colocar_a_venda:
          type: boolean
        voltar_para_frota:
          type: boolean
        bloquear:
          type: boolean
        desbloquear:
          type: boolean
        transferir:
          type: boolean
        baixar:
          type: boolean
        registrar_km:
          type: boolean
        corrigir_km:
          type: boolean
      required:
      - baixar
      - bloquear
      - colocar_a_venda
      - corrigir_km
      - desbloquear
      - editar
      - registrar_km
      - transferir
      - voltar_para_frota
    Aprovar:
      type: object
      properties:
        motivo:
          type: string
          maxLength: 300
    ArquivoAssinado:
      type: object
      properties:
        nome:
          type: string
        url:
          type: string
        url_expira_em:
          type: string
          format: date-time
      required:
      - nome
      - url
      - url_expira_em
    Assinatura:
      type: object
      properties:
        plano:
          $ref: '#/components/schemas/PlanoDaAssinatura'
        status:
          type: string
        teste:
          allOf:
          - $ref: '#/components/schemas/TesteDaAssinatura'
          nullable: true
        faixa_aviso:
          type: string
          nullable: true
        uso:
          $ref: '#/components/schemas/UsoAssinatura'
        somente_leitura:
          type: boolean
      required:
      - faixa_aviso
      - plano
      - somente_leitura
      - status
      - teste
      - uso
    Ativado:
      type: object
      properties:
        codigos_recuperacao:
          type: array
          items:
            type: string
        access:
          type: string
      required:
      - access
      - codigos_recuperacao
    Baixar:
      type: object
      properties:
        motivo:
          $ref: '#/components/schemas/MotivoEnum'
        descricao:
          type: string
          default: ''
      required:
      - motivo
    BloquearVeiculo:
      type: object
      properties:
        motivo:
          type: string
      required:
      - motivo
    Bloqueio:
      type: object
      properties:
        bloqueado:
          type: boolean
      required:
      - bloqueado
    Categoria:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        tipo_veiculo:
          $ref: '#/components/schemas/TipoVeiculoEnum'
        filial:
          allOf:
          - $ref: '#/components/schemas/IdNome'
          nullable: true
        ativo:
          type: boolean
        modelos_resumo:
          type: string
        veiculos:
          type: integer
        preco_vigente:
          allOf:
          - $ref: '#/components/schemas/PrecoComData'
          nullable: true
        proximo_preco:
          allOf:
          - $ref: '#/components/schemas/PrecoComData'
          nullable: true
      required:
      - ativo
      - filial
      - id
      - modelos_resumo
      - nome
      - preco_vigente
      - proximo_preco
      - tipo_veiculo
      - veiculos
    CategoriaEntrada:
      type: object
      properties:
        nome:
          type: string
          maxLength: 60
        tipo_veiculo:
          $ref: '#/components/schemas/TipoVeiculoEnum'
        filial_id:
          type: integer
          nullable: true
        preco:
          $ref: '#/components/schemas/PrecoEntrada'
      required:
      - nome
      - preco
      - tipo_veiculo
    Cep:
      type: object
      properties:
        cep:
          type: string
        logradouro:
          type: string
        bairro:
          type: string
        cidade:
          type: string
        uf:
          type: string
      required:
      - bairro
      - cep
      - cidade
      - logradouro
      - uf
    CobrancaEnum:
      enum:
      - por_periodo
      - unica
      type: string
      description: |-
        * `por_periodo` - Por período
        * `unica` - Única
    Codigo:
      type: object
      properties:
        codigo:
          type: string
          pattern: ^\d{6}$
      required:
      - codigo
    CodigoDoAutenticador:
      type: object
      properties:
        codigo:
          type: string
          pattern: ^\d{6}$
      required:
      - codigo
    Codigos:
      type: object
      properties:
        codigos_recuperacao:
          type: array
          items:
            type: string
      required:
      - codigos_recuperacao
    ColocarAVenda:
      type: object
