openapi: 3.0.3
info:
  title: API do Giro
  version: 0.1.0
  description: Contrato da API do Giro. Gerado pelo backend (make api-schema).
paths:
  /api/ambiente/:
    get:
      operationId: ambiente_retrieve
      description: 'Pública, sem login: com ou sem token (inclusive o do suporte),
        a resposta é a mesma.'
      summary: Hoje e se a data é simulada (ADR 0021)
      tags:
      - ambiente
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ambiente'
          description: ''
  /api/aprovacoes/:
    get:
      operationId: aprovacoes_list
      summary: Pedidos de aprovação (APR-01 a APR-09)
      parameters:
      - in: query
        name: minhas
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
      - in: query
        name: status
        schema:
          type: string
          enum:
          - aprovado
          - cancelado
          - pendente
          - recusado
      - in: query
        name: tipo
        schema:
          type: string
          enum:
          - APR-01
          - APR-02
          - APR-03
          - APR-04
          - APR-05
          - APR-06
      tags:
      - aprovacoes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaDePedidos'
          description: ''
  /api/aprovacoes/{id}/aprovar/:
    post:
      operationId: aprovacoes_aprovar_create
      summary: Aprovar (APR-09, APR-10)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - aprovacoes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Aprovar'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Aprovar'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Aprovar'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
          description: ''
  /api/aprovacoes/{id}/cancelar/:
    post:
      operationId: aprovacoes_cancelar_create
      summary: Quem pediu desiste
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - aprovacoes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
          description: ''
  /api/aprovacoes/{id}/recusar/:
    post:
      operationId: aprovacoes_recusar_create
      summary: Recusar com motivo (APR-07, APR-09, APR-10)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - aprovacoes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Recusar'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Recusar'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Recusar'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
          description: ''
  /api/assinatura/:
    get:
      operationId: assinatura_retrieve
      description: |-
        Do lado da empresa: plano, uso e situação da assinatura (PLT-03). Todos os perfis; os
        blocos do administrador só para ele (assinatura.md).
      summary: Assinatura e uso do plano (PLT-03)
      tags:
      - assinatura
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assinatura'
          description: ''
  /api/assinatura/dados-fiscais/:
    patch:
      operationId: assinatura_dados_fiscais_partial_update
      description: Nenhuma escrita da assinatura aceita o token de suporte (PLT-07,
        T-189).
      summary: Dados da nota fiscal da assinatura (PLT-15)
      tags:
      - assinatura
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPedidoDeDadosFiscais'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPedidoDeDadosFiscais'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPedidoDeDadosFiscais'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaDosDadosFiscais'
          description: ''
  /api/assinatura/faturas/:
    get:
      operationId: assinatura_faturas_list
      summary: Faturas da assinatura (PLT-14)
      parameters:
      - in: query
        name: status
        schema:
          type: string
          enum:
          - aberta
          - atrasada
          - cancelada
          - paga
      tags:
      - assinatura
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaDeFaturas'
          description: ''
  /api/assinatura/faturas/{codigo}/:
    get:
      operationId: assinatura_faturas_retrieve
      summary: Fatura da assinatura (PLT-14)
      parameters:
      - in: path
        name: codigo
        schema:
          type: string
        required: true
      tags:
      - assinatura
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaturaDetalhe'
          description: ''
  /api/assinatura/faturas/{codigo}/pagar/:
    post:
      operationId: assinatura_faturas_pagar_create
      description: Nenhuma escrita da assinatura aceita o token de suporte (PLT-07,
        T-189).
      summary: Pagar a fatura agora (PLT-14)
      parameters:
      - in: path
        name: codigo
        schema:
          type: string
        required: true
      tags:
      - assinatura
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoDePagar'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PedidoDePagar'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PedidoDePagar'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CobrancaDaFatura'
          description: ''
  /api/assinatura/forma-pagamento/:
    put:
      operationId: assinatura_forma_pagamento_update
      description: Nenhuma escrita da assinatura aceita o token de suporte (PLT-07,
        T-189).
      summary: Escolher a forma de pagamento da assinatura (PLT-13)
      tags:
      - assinatura
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoDeForma'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PedidoDeForma'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PedidoDeForma'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaDaForma'
          description: ''
  /api/assinatura/mudanca-plano/:
    post:
      operationId: assinatura_mudanca_plano_create
      description: Nenhuma escrita da assinatura aceita o token de suporte (PLT-07,
        T-189).
      summary: Mudar de plano (PLT-04, PLT-05)
      tags:
      - assinatura
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmarMudanca'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmarMudanca'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmarMudanca'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assinatura'
          description: ''
    delete:
      operationId: assinatura_mudanca_plano_destroy
      description: Nenhuma escrita da assinatura aceita o token de suporte (PLT-07,
        T-189).
      summary: Desfazer o downgrade agendado (PLT-04)
      tags:
      - assinatura
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/assinatura/mudanca-plano/simular/:
    post:
      operationId: assinatura_mudanca_plano_simular_create
      description: Nenhuma escrita da assinatura aceita o token de suporte (PLT-07,
        T-189).
      summary: Simular a mudança de plano, sem gravar (PLT-04)
      tags:
      - assinatura
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoDeMudanca'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PedidoDeMudanca'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PedidoDeMudanca'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Simulacao'
          description: ''
  /api/assinatura/planos/:
    get:
      operationId: assinatura_planos_list
      summary: Planos para mudar e comparar (PLT-04, PLT-11)
      tags:
      - assinatura
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanosParaMudar'
          description: ''
  /api/auditoria/eventos/:
    get:
      operationId: auditoria_eventos_list
      summary: Auditoria da empresa (AUD-02, AUD-03)
      parameters:
      - in: query
        name: ate
        schema:
          type: string
        description: data no fuso da empresa (2026-10-07)
      - in: query
        name: ator
        schema:
          type: integer
        description: id do usuário
      - in: query
        name: ator_tipo
        schema:
          type: string
          enum:
          - sistema
          - suporte
          - usuario
      - in: query
        name: categoria
        schema:
          type: string
          enum:
          - configuracoes
          - financeiro
          - operacao
          - seguranca
          - suporte
      - in: query
        name: de
        schema:
          type: string
        description: data no fuso da empresa (2026-10-01)
      - in: query
        name: filial
        schema:
          type: integer
      - in: query
        name: objeto_codigo
        schema:
          type: string
        description: LOC-2856
      - in: query
        name: objeto_id
        schema:
          type: integer
      - in: query
        name: objeto_tipo
        schema:
          type: string
      - in: query
        name: periodo
        schema:
          type: string
          enum:
          - 30d
          - 7d
          - 90d
        description: padrão 7d
      tags:
      - auditoria
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaDeEventos'
          description: ''
  /api/auditoria/eventos/{id}/:
    get:
      operationId: auditoria_eventos_retrieve
      summary: Evento com antes e depois já classificados (AUD-01, ADR 0014)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - auditoria
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoDetalhe'
          description: ''
  /api/auditoria/pessoas/:
    get:
      operationId: auditoria_pessoas_list
      summary: Pessoas para o filtro da auditoria
      parameters:
      - in: query
        name: ate
        schema:
          type: string
        description: data no fuso da empresa (2026-10-07)
      - in: query
        name: de
        schema:
          type: string
        description: data no fuso da empresa (2026-10-01)
      - in: query
        name: periodo
        schema:
          type: string
          enum:
          - 30d
          - 7d
          - 90d
        description: padrão 7d
      tags:
      - auditoria
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaDePessoas'
          description: ''
  /api/auth/2fa/ativar/:
    post:
      operationId: auth_2fa_ativar_create
      description: 'Rotas da própria conta (sessões, senha, 2 etapas): o suporte não
        usa (PLT-07).'
      summary: Ativar as 2 etapas por conta própria (USR-02)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodigoDoAutenticador'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CodigoDoAutenticador'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CodigoDoAutenticador'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ativado'
          description: ''
  /api/auth/2fa/codigos-recuperacao/:
    post:
      operationId: auth_2fa_codigos_recuperacao_create
      description: 'Rotas da própria conta (sessões, senha, 2 etapas): o suporte não
        usa (PLT-07).'
      summary: Novos códigos de recuperação
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmarSenha'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmarSenha'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmarSenha'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Codigos'
          description: ''
  /api/auth/2fa/configurar/:
    post:
      operationId: auth_2fa_configurar_create
      description: |-
        Com o `token_pre_2fa` (1º acesso ou 2 etapas que passaram a ser exigidas) ou com o access
        de quem quer ativar por conta própria.
      summary: Novo autenticador
      tags:
      - auth
      security:
      - jwtPre2faOuAccess: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configurar'
          description: ''
  /api/auth/2fa/desativar/:
    post:
      operationId: auth_2fa_desativar_create
      description: 'Rotas da própria conta (sessões, senha, 2 etapas): o suporte não
        usa (PLT-07).'
      summary: Desligar as 2 etapas (USR-02)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmarSenha'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmarSenha'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmarSenha'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/2fa/verificar/:
    post:
      operationId: auth_2fa_verificar_create
      summary: Confirmar o código (USR-02)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verificar2FA'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Verificar2FA'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Verificar2FA'
      security:
      - jwtPre2fa: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pronto'
          description: ''
  /api/auth/entrar/:
    post:
      operationId: auth_entrar_create
      summary: Entrar (USR-02, USR-06)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntrarEmpresa'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EntrarEmpresa'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EntrarEmpresa'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntrarEmpresaResposta'
          description: ''
  /api/auth/eu/:
    get:
      operationId: auth_eu_retrieve
      description: 'Rotas da própria conta (sessões, senha, 2 etapas): o suporte não
        usa (PLT-07).'
      summary: Quem está logado (USR-03, USR-05)
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EuDaEmpresa'
          description: ''
    patch:
      operationId: auth_eu_partial_update
      description: 'Rotas da própria conta (sessões, senha, 2 etapas): o suporte não
        usa (PLT-07).'
      summary: Meus dados
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEditarEu'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEditarEu'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEditarEu'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EuDaEmpresa'
          description: ''
  /api/auth/renovar/:
    post:
      operationId: auth_renovar_create
      summary: Renovar o acesso (USR-06)
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDaEmpresa'
          description: ''
  /api/auth/sair/:
    post:
      operationId: auth_sair_create
      summary: Sair
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/senha/esqueci/:
    post:
      operationId: auth_senha_esqueci_create
      summary: Esqueci a senha (não revela quem tem conta)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Email'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Email'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Email'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
          description: ''
  /api/auth/senha/redefinir/:
    post:
      operationId: auth_senha_redefinir_create
      summary: Criar a senha nova
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedefinirSenha'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RedefinirSenha'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RedefinirSenha'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/senha/trocar/:
    post:
      operationId: auth_senha_trocar_create
      description: 'Rotas da própria conta (sessões, senha, 2 etapas): o suporte não
        usa (PLT-07).'
      summary: Trocar a senha
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrocarSenha'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TrocarSenha'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TrocarSenha'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/sessoes/:
    get:
      operationId: auth_sessoes_retrieve
      description: 'Rotas da própria conta (sessões, senha, 2 etapas): o suporte não
        usa (PLT-07).'
      summary: Minhas sessões ativas
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessoes'
          description: ''
  /api/auth/sessoes/{id}/encerrar/:
    post:
      operationId: auth_sessoes_encerrar_create
      description: 'Rotas da própria conta (sessões, senha, 2 etapas): o suporte não
        usa (PLT-07).'
      summary: Encerrar uma sessão minha
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/sessoes/encerrar-outras/:
    post:
      operationId: auth_sessoes_encerrar_outras_create
      description: 'Rotas da própria conta (sessões, senha, 2 etapas): o suporte não
        usa (PLT-07).'
      summary: Encerrar as outras sessões
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/suporte/sair/:
    post:
      operationId: auth_suporte_sair_create
      description: O suporte encerra o próprio acesso (`encerrado`), com evento nas
        duas auditorias.
      summary: Sair do modo suporte (PLT-07)
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/categorias/:
    get:
      operationId: categorias_list
      summary: Categorias e preços vigentes (LOC-01)
      parameters:
      - in: query
        name: ativo
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
      - in: query
        name: filial
        schema:
          type: integer
      - in: query
        name: tipo_veiculo
        schema:
