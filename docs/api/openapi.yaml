      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
          description: ''
  /api/convites/aceitar/:
    post:
      operationId: convites_aceitar_create
      summary: Aceitar o convite (USR-01)
      tags:
