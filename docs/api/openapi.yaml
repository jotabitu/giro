      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Token'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Token'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Token'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConviteDaEmpresa'
          description: ''
  /api/enderecos/cep/{cep}/:
    get:
      operationId: enderecos_cep_retrieve
      summary: Busca de CEP
      parameters:
      - in: path
        name: cep
        schema:
          type: string
        required: true
      tags:
