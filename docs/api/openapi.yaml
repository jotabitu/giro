        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrecoCriado'
          description: ''
  /api/categorias/{id}/precos/{vigente_desde}/:
    put:
      operationId: categorias_precos_update
      summary: Trocar preço agendado (LOC-15)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: vigente_desde
        schema:
          type: string
        required: true
      tags:
      - categorias
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrecoEntrada'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PrecoEntrada'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PrecoEntrada'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrecoCriado'
          description: ''
  /api/categorias/{id}/reativar/:
