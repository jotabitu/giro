          description: ''
  /api/extras/:
    get:
      operationId: extras_list
      summary: Extras da locação (LOC-02)
      parameters:
      - in: query
        name: ativo
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
      tags:
      - extras
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaDeExtras'
