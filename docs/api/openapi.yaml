          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Extra'
          description: ''
  /api/filiais/:
    get:
      operationId: filiais_list
      summary: Filiais da empresa (FIL-01, PLT-03)
      parameters:
      - in: query
        name: ativo
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
      - in: query
        name: busca
        schema:
          type: string
      tags:
      - filiais
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaDeFiliais'
          description: ''
    post:
      operationId: filiais_create
      summary: Nova filial
      tags:
      - filiais
      requestBody:
