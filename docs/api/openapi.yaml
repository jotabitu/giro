openapi: 3.0.3
info:
  title: API do Giro
  version: 0.1.0
  description: Contrato da API do Giro. Gerado pelo backend (make api-schema).
paths:
  /api/assinatura/:
    get:
      operationId: assinatura_retrieve
      description: 'Do lado da empresa: plano, uso e situação da assinatura (PLT-03).
        Todos os perfis.'
      summary: Assinatura e uso do plano (PLT-03)
      tags:
      - assinatura
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assinatura'
          description: ''
  /api/auth/2fa/ativar/:
    post:
      operationId: auth_2fa_ativar_create
      description: 'Rotas da própria conta (sessões, senha, 2 etapas): o suporte não
        usa (PLT-07).'
      summary: Ativar as 2 etapas por conta própria (USR-02)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodigoDoAutenticador'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CodigoDoAutenticador'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CodigoDoAutenticador'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ativado'
          description: ''
  /api/auth/2fa/codigos-recuperacao/:
    post:
      operationId: auth_2fa_codigos_recuperacao_create
      description: 'Rotas da própria conta (sessões, senha, 2 etapas): o suporte não
        usa (PLT-07).'
      summary: Novos códigos de recuperação
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmarSenha'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmarSenha'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmarSenha'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Codigos'
          description: ''
  /api/auth/2fa/configurar/:
    post:
      operationId: auth_2fa_configurar_create
      description: |-
        Com o `token_pre_2fa` (1º acesso ou 2 etapas que passaram a ser exigidas) ou com o access
        de quem quer ativar por conta própria.
      summary: Novo autenticador
      tags:
      - auth
      security:
      - jwtPre2faOuAccess: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configurar'
          description: ''
  /api/auth/2fa/desativar/:
    post:
      operationId: auth_2fa_desativar_create
      description: 'Rotas da própria conta (sessões, senha, 2 etapas): o suporte não
        usa (PLT-07).'
      summary: Desligar as 2 etapas (USR-02)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmarSenha'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmarSenha'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmarSenha'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/2fa/verificar/:
    post:
      operationId: auth_2fa_verificar_create
      summary: Confirmar o código (USR-02)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verificar2FA'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Verificar2FA'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Verificar2FA'
      security:
      - jwtPre2fa: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pronto'
          description: ''
  /api/auth/entrar/:
    post:
      operationId: auth_entrar_create
      summary: Entrar (USR-02, USR-06)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntrarEmpresa'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EntrarEmpresa'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EntrarEmpresa'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntrarEmpresaResposta'
          description: ''
  /api/auth/eu/:
    get:
      operationId: auth_eu_retrieve
      description: 'Rotas da própria conta (sessões, senha, 2 etapas): o suporte não
        usa (PLT-07).'
      summary: Quem está logado (USR-03, USR-05)
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EuDaEmpresa'
          description: ''
    patch:
      operationId: auth_eu_partial_update
      description: 'Rotas da própria conta (sessões, senha, 2 etapas): o suporte não
        usa (PLT-07).'
      summary: Meus dados
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEditarEu'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEditarEu'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEditarEu'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EuDaEmpresa'
          description: ''
  /api/auth/renovar/:
    post:
      operationId: auth_renovar_create
      summary: Renovar o acesso (USR-06)
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDaEmpresa'
          description: ''
  /api/auth/sair/:
    post:
      operationId: auth_sair_create
      summary: Sair
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/senha/esqueci/:
    post:
      operationId: auth_senha_esqueci_create
      summary: Esqueci a senha (não revela quem tem conta)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Email'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Email'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Email'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
          description: ''
  /api/auth/senha/redefinir/:
    post:
      operationId: auth_senha_redefinir_create
      summary: Criar a senha nova
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedefinirSenha'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RedefinirSenha'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RedefinirSenha'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/senha/trocar/:
    post:
      operationId: auth_senha_trocar_create
      description: 'Rotas da própria conta (sessões, senha, 2 etapas): o suporte não
        usa (PLT-07).'
      summary: Trocar a senha
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrocarSenha'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TrocarSenha'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TrocarSenha'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/sessoes/:
    get:
      operationId: auth_sessoes_retrieve
      description: 'Rotas da própria conta (sessões, senha, 2 etapas): o suporte não
        usa (PLT-07).'
      summary: Minhas sessões ativas
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessoes'
          description: ''
  /api/auth/sessoes/{id}/encerrar/:
    post:
      operationId: auth_sessoes_encerrar_create
      description: 'Rotas da própria conta (sessões, senha, 2 etapas): o suporte não
        usa (PLT-07).'
      summary: Encerrar uma sessão minha
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/sessoes/encerrar-outras/:
    post:
      operationId: auth_sessoes_encerrar_outras_create
      description: 'Rotas da própria conta (sessões, senha, 2 etapas): o suporte não
        usa (PLT-07).'
      summary: Encerrar as outras sessões
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/suporte/sair/:
    post:
      operationId: auth_suporte_sair_create
      description: O suporte encerra o próprio acesso (`encerrado`), com evento nas
        duas auditorias.
      summary: Sair do modo suporte (PLT-07)
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/convites/aceitar/:
    post:
      operationId: convites_aceitar_create
      summary: Aceitar o convite (USR-01)
      tags:
      - convites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AceitarConvite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AceitarConvite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AceitarConvite'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AceitarConviteResposta'
          description: ''
  /api/convites/consultar/:
    post:
      operationId: convites_consultar_create
      summary: Ler o convite para a tela (USR-01)
      tags:
      - convites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Token'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Token'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Token'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConviteDaEmpresa'
          description: ''
  /api/enderecos/cep/{cep}/:
    get:
      operationId: enderecos_cep_retrieve
      summary: Busca de CEP
      parameters:
      - in: path
        name: cep
        schema:
          type: string
        required: true
      tags:
      - enderecos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cep'
          description: ''
  /api/filiais/:
    get:
      operationId: filiais_list
      summary: Filiais da empresa (FIL-01, PLT-03)
      parameters:
      - in: query
        name: ativo
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
      - in: query
        name: busca
        schema:
          type: string
      tags:
      - filiais
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaDeFiliais'
          description: ''
    post:
      operationId: filiais_create
      summary: Nova filial
      tags:
      - filiais
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilialEntrada'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FilialEntrada'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FilialEntrada'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filial'
          description: ''
  /api/filiais/{id}/:
    get:
      operationId: filiais_retrieve
      description: GET para quem tem a filial no escopo (fora dele, 404); PATCH só
        do administrador.
      summary: Filial
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - filiais
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filial'
          description: ''
    patch:
      operationId: filiais_partial_update
      description: GET para quem tem a filial no escopo (fora dele, 404); PATCH só
        do administrador.
      summary: Editar filial
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - filiais
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFilialEntrada'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFilialEntrada'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFilialEntrada'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filial'
          description: ''
  /api/filiais/{id}/desativar/:
    post:
      operationId: filiais_desativar_create
      summary: Desativar (FIL-06)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - filiais
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Motivo'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Motivo'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Motivo'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filial'
          description: ''
  /api/filiais/{id}/feriados/:
    get:
      operationId: filiais_feriados_retrieve
      summary: Feriados da filial (FIL-03)
      parameters:
      - in: query
        name: ano
        schema:
          type: integer
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - filiais
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaDeFeriados'
          description: ''
    post:
      operationId: filiais_feriados_create
      summary: Confirmar feriados (FIL-03)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - filiais
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeriadosEntrada'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FeriadosEntrada'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FeriadosEntrada'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaDeFeriados'
          description: ''
  /api/filiais/{id}/feriados/{feriado_id}/remover/:
    post:
      operationId: filiais_feriados_remover_create
      summary: Remover feriado
      parameters:
      - in: path
        name: feriado_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - filiais
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaDeFeriados'
          description: ''
  /api/filiais/{id}/feriados/sugestoes/:
    get:
      operationId: filiais_feriados_sugestoes_retrieve
      summary: Feriados nacionais sugeridos (FIL-03)
      parameters:
      - in: query
        name: ano
        schema:
          type: integer
      - in: path
