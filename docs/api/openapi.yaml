components:
  schemas:
    AbrirAcesso:
      type: object
      properties:
        motivo:
          type: string
          maxLength: 500
        chamado_id:
          type: integer
          nullable: true
        duracao_minutos:
          $ref: '#/components/schemas/DuracaoMinutosEnum'
        permissao:
          $ref: '#/components/schemas/PermissaoSuporteEnum'
      required:
      - duracao_minutos
      - motivo
      - permissao
    Access:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    AccessDaEmpresa:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    AceitarConvite:
      type: object
      properties:
        token:
          type: string
          maxLength: 100
        nome:
          type: string
          maxLength: 150
        senha:
          type: string
        aparelho:
          allOf:
          - $ref: '#/components/schemas/TipoSessaoEnum'
          default: desktop
      required:
      - senha
      - token
    AceitarConviteDaEquipe:
      type: object
      properties:
        token:
          type: string
          maxLength: 100
        senha:
          type: string
      required:
      - senha
      - token
    AceitarConviteResposta:
      oneOf:
      - $ref: '#/components/schemas/Pronto'
      - $ref: '#/components/schemas/EtapaDoLogin'
    AcessoAberto:
      type: object
      properties:
        acesso_suporte_id:
          type: integer
        fim:
          type: string
          format: date-time
        url_entrada:
          type: string
      required:
      - acesso_suporte_id
      - fim
      - url_entrada
    AcessoDaLista:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        motivo:
          type: string
        permissao:
          $ref: '#/components/schemas/PermissaoSuporteEnum'
        inicio:
          type: string
          format: date-time
        fim:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - fim
      - id
      - inicio
      - motivo
      - nome
      - permissao
      - status
    Acoes:
      type: object
      properties:
        entrar_como_suporte:
          type: boolean
        estender_teste:
          type: boolean
        mudar_plano:
          type: boolean
        suspender:
          type: boolean
      required:
      - entrar_como_suporte
      - estender_teste
      - mudar_plano
      - suspender
    Assinatura:
      type: object
      properties:
        plano:
          $ref: '#/components/schemas/PlanoDaAssinatura'
        status:
          type: string
        teste:
          allOf:
          - $ref: '#/components/schemas/TesteDaAssinatura'
          nullable: true
        faixa_aviso:
          type: string
          nullable: true
        uso:
          $ref: '#/components/schemas/UsoAssinatura'
        somente_leitura:
          type: boolean
      required:
      - faixa_aviso
      - plano
      - somente_leitura
      - status
      - teste
      - uso
    Ativado:
      type: object
      properties:
        codigos_recuperacao:
          type: array
          items:
            type: string
        access:
          type: string
      required:
      - access
      - codigos_recuperacao
    Bloqueio:
      type: object
      properties:
        bloqueado:
          type: boolean
      required:
      - bloqueado
    Cep:
      type: object
      properties:
        cep:
          type: string
        logradouro:
          type: string
        bairro:
          type: string
        cidade:
          type: string
        uf:
          type: string
      required:
      - bairro
      - cep
      - cidade
      - logradouro
      - uf
    Codigo:
      type: object
      properties:
        codigo:
          type: string
          pattern: ^\d{6}$
      required:
      - codigo
    CodigoDoAutenticador:
      type: object
      properties:
        codigo:
          type: string
          pattern: ^\d{6}$
      required:
      - codigo
    Codigos:
      type: object
      properties:
        codigos_recuperacao:
          type: array
          items:
            type: string
      required:
      - codigos_recuperacao
    Configurar:
      type: object
      properties:
        otpauth_uri:
          type: string
        chave:
          type: string
      required:
      - chave
      - otpauth_uri
    Configurar2FA:
      type: object
      properties:
        otpauth_uri:
          type: string
      required:
      - otpauth_uri
    ConfirmarSenha:
      type: object
      properties:
        senha:
          type: string
      required:
      - senha
    Contagens:
      type: object
      properties:
        todas:
          type: integer
        pagantes:
          type: integer
        em_teste:
          type: integer
        ativa:
          type: integer
        com_problema:
          type: integer
        saindo:
          type: integer
      required:
      - ativa
      - com_problema
      - em_teste
      - pagantes
      - saindo
      - todas
    ContagensDeUsuarios:
      type: object
      properties:
        todos:
          type: integer
        ativos:
          type: integer
        convites:
          type: integer
        desativados:
          type: integer
      required:
      - ativos
      - convites
      - desativados
      - todos
    Contato:
      type: object
      properties:
        telefone:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
    Convidar:
      type: object
      properties:
        email:
          type: string
          format: email
        nome:
          type: string
          maxLength: 150
        celular:
          type: string
          maxLength: 20
        perfil:
          $ref: '#/components/schemas/PerfilEnum'
        filiais:
          type: array
          items:
            type: integer
        permissoes_extras:
          type: array
          items:
            $ref: '#/components/schemas/PermissaoExtraEnum'
      required:
      - email
      - perfil
    Convite:
      type: object
      properties:
        email:
          type: string
          format: email
        nome:
          type: string
        funcao:
          type: string
        expira_em:
          type: string
          format: date-time
      required:
      - email
      - expira_em
      - funcao
      - nome
    ConviteDaEmpresa:
      type: object
      properties:
        empresa:
          type: string
        email:
          type: string
          format: email
        nome:
          type: string
        perfil:
          $ref: '#/components/schemas/PerfilEnum'
        filiais:
          type: array
          items:
            $ref: '#/components/schemas/FilialResumo'
        convidado_por:
          type: string
          nullable: true
        expira_em:
          type: string
          format: date-time
        exige_2fa:
          type: boolean
      required:
      - convidado_por
      - email
      - empresa
      - exige_2fa
      - expira_em
      - filiais
      - nome
      - perfil
    DespesasLancarEnum:
      enum:
      - todas
      - manutencao
      - nao
      type: string
      description: |-
        * `todas` - todas
        * `manutencao` - manutencao
        * `nao` - nao
    DoisFatores:
      type: object
      properties:
        ativo:
          type: boolean
        obrigatorio:
          type: boolean
        codigos_recuperacao_restantes:
          type: integer
      required:
      - ativo
      - codigos_recuperacao_restantes
      - obrigatorio
    DuracaoMinutosEnum:
      enum:
      - 15
      - 30
      - 60
      type: integer
      description: |-
        * `15` - 15
        * `30` - 30
        * `60` - 60
    Email:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    EmpresaDetalhe:
      type: object
      properties:
        id:
          type: integer
        razao_social:
          type: string
        nome_exibicao:
          type: string
        cnpj:
          type: string
          nullable: true
        subdominio:
          type: string
          nullable: true
        endereco_acesso:
          type: string
        cidade:
          type: string
        uf:
          type: string
        responsavel:
          $ref: '#/components/schemas/Responsavel'
        cliente_desde:
          type: string
          format: date
          nullable: true
        plano:
          allOf:
          - $ref: '#/components/schemas/PlanoResumo'
          nullable: true
        ciclo:
          type: string
        preco_contratado_centavos:
          type: integer
        status:
          type: string
        situacao:
          $ref: '#/components/schemas/Situacao'
        teste:
          $ref: '#/components/schemas/Teste'
        uso:
          $ref: '#/components/schemas/UsoDetalhe'
        implantacao:
          $ref: '#/components/schemas/Implantacao'
        locacoes_total:
          type: integer
        chamados_abertos:
          type: integer
        suporte_bloqueado:
          type: boolean
        faturas_recentes:
          type: array
          items:
            type: object
            additionalProperties: {}
        acoes:
          $ref: '#/components/schemas/Acoes'
      required:
      - acoes
      - chamados_abertos
      - ciclo
      - cidade
      - cliente_desde
      - cnpj
      - endereco_acesso
