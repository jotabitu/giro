  /api/extras/{id}/:
    patch:
      operationId: extras_partial_update
      summary: Editar
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - extras
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedExtraEntrada'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedExtraEntrada'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedExtraEntrada'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Extra'
          description: ''
  /api/extras/{id}/desativar/:
    post:
      operationId: extras_desativar_create
      summary: Desativar extra
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
