            application/json:
              schema:
                $ref: '#/components/schemas/EntrarResposta'
          description: ''
  /api/plataforma/auth/eu/:
    get:
      operationId: plataforma_auth_eu_retrieve
      summary: Quem está na plataforma (PLT-09)
      tags:
      - plataforma
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Eu'
          description: ''
  /api/plataforma/auth/renovar/:
    post:
      operationId: plataforma_auth_renovar_create
      summary: Renovar o acesso pelo cookie
      tags:
      - plataforma
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access'
          description: ''
  /api/plataforma/auth/sair/:
    post:
      operationId: plataforma_auth_sair_create
      summary: Sair
      tags:
      - plataforma
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/plataforma/convites/aceitar/:
    post:
      operationId: plataforma_convites_aceitar_create
      summary: Aceitar convite da equipe
      tags:
      - plataforma
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AceitarConviteDaEquipe'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AceitarConviteDaEquipe'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AceitarConviteDaEquipe'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
