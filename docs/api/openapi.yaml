          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Codigo'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Codigo'
        required: true
      security:
      - jwtPre2fa: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entrou'
          description: ''
  /api/plataforma/auth/entrar/:
    post:
      operationId: plataforma_auth_entrar_create
      summary: Entrar na plataforma (PLT-08)
      tags:
      - plataforma
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Entrar'
          application/x-www-form-urlencoded:
            schema:
