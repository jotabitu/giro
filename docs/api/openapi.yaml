openapi: 3.0.3
info:
  title: API do Giro
  version: 0.1.0
  description: Contrato da API do Giro. Gerado pelo backend (make api-schema).
paths:
  /api/assinatura/:
    get:
      operationId: assinatura_retrieve
      description: 'Do lado da empresa: plano, uso e situação da assinatura (PLT-03).
        Todos os perfis.'
      summary: Assinatura e uso do plano (PLT-03)
      tags:
      - assinatura
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assinatura'
          description: ''
  /api/enderecos/cep/{cep}/:
    get:
      operationId: enderecos_cep_retrieve
      summary: Busca de CEP
      parameters:
      - in: path
        name: cep
        schema:
          type: string
        required: true
      tags:
      - enderecos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cep'
          description: ''
  /api/filiais/:
    get:
      operationId: filiais_list
      summary: Filiais da empresa (FIL-01, PLT-03)
      parameters:
      - in: query
        name: ativo
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
      - in: query
        name: busca
        schema:
          type: string
      tags:
      - filiais
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaDeFiliais'
          description: ''
    post:
      operationId: filiais_create
      summary: Nova filial
      tags:
      - filiais
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilialEntrada'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FilialEntrada'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FilialEntrada'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filial'
          description: ''
  /api/filiais/{id}/:
    get:
      operationId: filiais_retrieve
      description: GET para quem tem a filial no escopo (fora dele, 404); PATCH só
        do administrador.
      summary: Filial
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - filiais
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filial'
          description: ''
    patch:
      operationId: filiais_partial_update
      description: GET para quem tem a filial no escopo (fora dele, 404); PATCH só
        do administrador.
      summary: Editar filial
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - filiais
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFilialEntrada'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFilialEntrada'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFilialEntrada'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filial'
          description: ''
  /api/filiais/{id}/desativar/:
    post:
      operationId: filiais_desativar_create
      summary: Desativar (FIL-06)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - filiais
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Motivo'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Motivo'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Motivo'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filial'
          description: ''
  /api/filiais/{id}/feriados/:
    get:
      operationId: filiais_feriados_retrieve
      summary: Feriados da filial (FIL-03)
      parameters:
      - in: query
        name: ano
        schema:
          type: integer
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - filiais
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaDeFeriados'
          description: ''
    post:
      operationId: filiais_feriados_create
      summary: Confirmar feriados (FIL-03)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - filiais
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeriadosEntrada'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FeriadosEntrada'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FeriadosEntrada'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaDeFeriados'
          description: ''
  /api/filiais/{id}/feriados/{feriado_id}/remover/:
    post:
      operationId: filiais_feriados_remover_create
      summary: Remover feriado
      parameters:
      - in: path
        name: feriado_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - filiais
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaDeFeriados'
          description: ''
  /api/filiais/{id}/feriados/sugestoes/:
    get:
      operationId: filiais_feriados_sugestoes_retrieve
      summary: Feriados nacionais sugeridos (FIL-03)
      parameters:
      - in: query
        name: ano
        schema:
          type: integer
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - filiais
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaDeSugestoes'
          description: ''
  /api/filiais/{id}/reativar/:
    post:
      operationId: filiais_reativar_create
      summary: Reativar (PLT-03)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - filiais
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Motivo'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Motivo'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Motivo'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filial'
          description: ''
  /api/filiais/{id}/tornar-matriz/:
    post:
      operationId: filiais_tornar_matriz_create
      summary: Tornar matriz (FIL-01)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - filiais
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filial'
          description: ''
  /api/filiais/minhas/:
    get:
      operationId: filiais_minhas_retrieve
      summary: Seletor de filial (USR-07)
      tags:
      - filiais
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinhasFiliais'
          description: ''
  /api/plataforma/auth/2fa/configurar/:
    post:
      operationId: plataforma_auth_2fa_configurar_create
      summary: Novo autenticador (PLT-08)
      tags:
      - plataforma
      security:
      - jwtPre2fa: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configurar2FA'
          description: ''
  /api/plataforma/auth/2fa/verificar/:
    post:
      operationId: plataforma_auth_2fa_verificar_create
      summary: Confirmar o código (PLT-08)
      tags:
      - plataforma
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Codigo'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Codigo'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Codigo'
        required: true
      security:
      - jwtPre2fa: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entrou'
          description: ''
  /api/plataforma/auth/entrar/:
    post:
      operationId: plataforma_auth_entrar_create
      summary: Entrar na plataforma (PLT-08)
      tags:
      - plataforma
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Entrar'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Entrar'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Entrar'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntrarResposta'
          description: ''
  /api/plataforma/auth/eu/:
    get:
      operationId: plataforma_auth_eu_retrieve
      summary: Quem está na plataforma (PLT-09)
      tags:
      - plataforma
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Eu'
          description: ''
  /api/plataforma/auth/renovar/:
    post:
      operationId: plataforma_auth_renovar_create
      summary: Renovar o acesso pelo cookie
      tags:
      - plataforma
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access'
          description: ''
  /api/plataforma/auth/sair/:
    post:
      operationId: plataforma_auth_sair_create
      summary: Sair
      tags:
      - plataforma
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/plataforma/convites/{token}/:
    get:
      operationId: plataforma_convites_retrieve
      summary: Ver convite da equipe
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - plataforma
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Convite'
          description: ''
  /api/plataforma/convites/{token}/aceitar/:
    post:
      operationId: plataforma_convites_aceitar_create
      summary: Aceitar convite da equipe
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - plataforma
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Senha'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Senha'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Senha'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Etapa'
          description: ''
  /api/plataforma/empresas/:
    get:
      operationId: plataforma_empresas_list
      summary: Empresas da plataforma (IMP-05)
      parameters:
      - in: query
        name: busca
        schema:
          type: string
      - in: query
        name: ordem
        schema:
          type: string
          enum:
          - -criado_em
          - -ultimo_acesso_em
          - nome
      - in: query
        name: plano
        schema:
          type: integer
      - in: query
        name: situacao
        schema:
          type: string
          enum:
          - ativa
          - com_problema
          - em_teste
          - saindo
      - in: query
        name: status
        schema:
          type: string
      tags:
      - plataforma
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaDeEmpresas'
          description: ''
  /api/plataforma/empresas/{id}/:
    get:
      operationId: plataforma_empresas_retrieve
      summary: Detalhe da empresa (PLT-01)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - plataforma
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpresaDetalhe'
          description: ''
  /api/plataforma/planos/:
    get:
      operationId: plataforma_planos_list
      summary: Planos (PLT-03)
      tags:
      - plataforma
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaDePlanos'
          description: ''
components:
  schemas:
    Access:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    Acoes:
      type: object
      properties:
        entrar_como_suporte:
          type: boolean
        estender_teste:
          type: boolean
        mudar_plano:
          type: boolean
        suspender:
          type: boolean
      required:
      - entrar_como_suporte
      - estender_teste
      - mudar_plano
      - suspender
    Assinatura:
      type: object
      properties:
        plano:
          $ref: '#/components/schemas/PlanoDaAssinatura'
        status:
          type: string
        teste:
          allOf:
          - $ref: '#/components/schemas/TesteDaAssinatura'
          nullable: true
        faixa_aviso:
          type: string
          nullable: true
        uso:
          $ref: '#/components/schemas/UsoAssinatura'
        somente_leitura:
          type: boolean
      required:
      - faixa_aviso
      - plano
      - somente_leitura
      - status
      - teste
      - uso
    Cep:
      type: object
      properties:
        cep:
          type: string
        logradouro:
          type: string
        bairro:
          type: string
        cidade:
          type: string
        uf:
          type: string
      required:
      - bairro
      - cep
      - cidade
      - logradouro
      - uf
    Codigo:
      type: object
      properties:
        codigo:
          type: string
          pattern: ^\d{6}$
      required:
      - codigo
    Configurar2FA:
      type: object
      properties:
        otpauth_uri:
          type: string
      required:
      - otpauth_uri
    Contagens:
      type: object
      properties:
        todas:
          type: integer
        pagantes:
          type: integer
        em_teste:
          type: integer
        ativa:
          type: integer
        com_problema:
          type: integer
        saindo:
          type: integer
      required:
      - ativa
      - com_problema
      - em_teste
      - pagantes
      - saindo
      - todas
    Contato:
      type: object
      properties:
        telefone:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
    Convite:
      type: object
      properties:
        email:
          type: string
          format: email
        nome:
          type: string
        funcao:
          type: string
        expira_em:
          type: string
          format: date-time
      required:
      - email
      - expira_em
      - funcao
      - nome
    EmpresaDetalhe:
      type: object
      properties:
        id:
          type: integer
        razao_social:
          type: string
        nome_exibicao:
          type: string
        cnpj:
          type: string
          nullable: true
        subdominio:
          type: string
          nullable: true
        endereco_acesso:
          type: string
        cidade:
          type: string
        uf:
          type: string
        responsavel:
          $ref: '#/components/schemas/Responsavel'
        cliente_desde:
          type: string
          format: date
          nullable: true
        plano:
          allOf:
          - $ref: '#/components/schemas/PlanoResumo'
          nullable: true
        ciclo:
          type: string
        preco_contratado_centavos:
          type: integer
        status:
          type: string
        situacao:
          $ref: '#/components/schemas/Situacao'
        teste:
          $ref: '#/components/schemas/Teste'
        uso:
          $ref: '#/components/schemas/UsoDetalhe'
        implantacao:
          $ref: '#/components/schemas/Implantacao'
        locacoes_total:
          type: integer
        chamados_abertos:
          type: integer
        suporte_bloqueado:
          type: boolean
        faturas_recentes:
          type: array
          items:
            type: object
            additionalProperties: {}
        acoes:
          $ref: '#/components/schemas/Acoes'
      required:
      - acoes
      - chamados_abertos
      - ciclo
      - cidade
      - cliente_desde
      - cnpj
      - endereco_acesso
      - faturas_recentes
      - id
      - implantacao
      - locacoes_total
      - nome_exibicao
      - plano
      - preco_contratado_centavos
      - razao_social
      - responsavel
      - situacao
      - status
      - subdominio
      - suporte_bloqueado
      - teste
      - uf
      - uso
    EmpresaLista:
      type: object
      properties:
        id:
          type: integer
        nome_exibicao:
          type: string
        subdominio:
          type: string
        cidade:
          type: string
        uf:
          type: string
        plano:
          allOf:
          - $ref: '#/components/schemas/PlanoResumo'
          nullable: true
        status:
          type: string
        uso:
          $ref: '#/components/schemas/UsoNaLista'
        situacao:
          $ref: '#/components/schemas/Situacao'
        ultimo_acesso_em:
          type: string
          format: date-time
          nullable: true
      required:
      - cidade
      - id
      - nome_exibicao
      - plano
      - situacao
      - status
      - subdominio
      - uf
      - ultimo_acesso_em
      - uso
    Endereco:
      type: object
      properties:
        cep:
          type: string
        logradouro:
          type: string
        numero:
          type: string
        complemento:
          type: string
          nullable: true
        bairro:
          type: string
        cidade:
          type: string
        uf:
          type: string
      required:
      - bairro
      - cep
      - cidade
      - logradouro
      - numero
      - uf
    Entrar:
      type: object
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
        codigo:
          type: string
          maxLength: 6
        codigo_recuperacao:
          type: string
          maxLength: 20
      required:
      - email
      - senha
    EntrarResposta:
      oneOf:
      - $ref: '#/components/schemas/Entrou'
      - $ref: '#/components/schemas/Etapa'
    Entrou:
      type: object
      properties:
        access:
          type: string
        usuario:
          $ref: '#/components/schemas/UsuarioDaPlataforma'
        codigos_recuperacao:
          type: array
          items:
            type: string
      required:
      - access
      - usuario
    Etapa:
      type: object
      properties:
        etapa:
          $ref: '#/components/schemas/EtapaEnum'
        token_pre_2fa:
          type: string
      required:
      - etapa
      - token_pre_2fa
    EtapaEnum:
      enum:
      - configurar_2fa
      type: string
      description: '* `configurar_2fa` - configurar_2fa'
    Eu:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        email:
          type: string
          format: email
        funcao:
          type: string
        pode:
          $ref: '#/components/schemas/Pode'
        dois_fatores_ativo:
          type: boolean
        codigos_recuperacao_restantes:
          type: integer
      required:
      - codigos_recuperacao_restantes
      - dois_fatores_ativo
      - email
      - funcao
      - id
      - nome
      - pode
    Feriado:
      type: object
      properties:
        id:
          type: integer
        data:
          type: string
          format: date
        nome:
          type: string
        origem:
          type: string
      required:
      - data
      - id
      - nome
      - origem
    FeriadoEntrada:
      type: object
      properties:
        data:
          type: string
          format: date
        nome:
          type: string
          maxLength: 80
        origem:
          $ref: '#/components/schemas/OrigemEnum'
      required:
      - data
      - nome
      - origem
    FeriadoProximo:
      type: object
      properties:
        data:
          type: string
          format: date
        nome:
          type: string
      required:
      - data
      - nome
    FeriadosEntrada:
      type: object
      properties:
        feriados:
          type: array
          items:
            $ref: '#/components/schemas/FeriadoEntrada'
      required:
      - feriados
    Filial:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        matriz:
          type: boolean
        ativo:
          type: boolean
        cnpj:
          type: string
          nullable: true
        inscricao_estadual:
          type: string
          nullable: true
        inscricao_municipal:
          type: string
          nullable: true
        endereco:
          $ref: '#/components/schemas/Endereco'
        contato:
          $ref: '#/components/schemas/Contato'
        preco_litro_centavos:
          type: integer
          nullable: true
