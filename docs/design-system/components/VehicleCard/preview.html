<!-- @dsCard group="Cards" height=440 subtitle="Veículo em destaque com contrato em andamento" -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>VehicleCard</title></head>
<body>
<div class="wl-stage">
<article class="wl-vcard" style="width:520px">
  <div class="wl-vcard__media">
    <div class="wl-vcard__placeholder" aria-hidden="true">
      <svg viewBox="0 0 120 64" width="168" height="90" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="44" r="14"/><circle cx="96" cy="44" r="14"/><path d="M24 44 44 20h26l16 24M44 20l-8-10H24M70 20l6-12h14"/><path d="M52 44h22"/></svg>
    </div>
    <div class="wl-vcard__top">
      <span class="wl-badge wl-badge--surface"><span class="wl-mono" style="font-weight:500">QXA-4B21</span></span>
      <span class="wl-badge wl-badge--attention"><span class="wl-badge__dot"></span>Devolução hoje</span>
    </div>
    <div class="wl-vcard__info">
      <div class="wl-vcard__name">
        <div><h3 class="wl-vcard__model">Honda CG 160 Fan</h3><div class="wl-muted" style="font-size:14px">Carlos Menezes · contrato LOC-2841</div></div>
        <button class="wl-icon-btn wl-icon-btn--sunken wl-icon-btn--sm" aria-label="Abrir contrato"><svg class="wl-i" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg></button>
      </div>
      <div class="wl-progress"><div class="wl-progress__track"><div class="wl-progress__fill" style="width:93%"></div></div>28 de 30 dias</div>
      <dl class="wl-facts" style="margin:0"><div><dt>Diária</dt><dd>R$ 49,90</dd></div><div><dt>Rodados</dt><dd>2.140 km</dd></div><div><dt>Próxima revisão</dt><dd>15.000 km</dd></div></dl>
    </div>
  </div>
</article>
</div>
</body>
</html>
