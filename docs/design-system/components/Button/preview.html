<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div class="wl-stage">
  <button class="wl-btn wl-btn--solid"><svg class="wl-i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nova locação</button>
  <button class="wl-btn wl-btn--brand">Ver alertas</button>
  <button class="wl-btn">Exportar</button>
  <button class="wl-btn wl-btn--quiet">Cancelar</button>
  <button class="wl-btn wl-btn--solid" disabled>Salvar</button>
</div>
<div class="wl-stage" style="padding-top:0">
  <button class="wl-btn wl-btn--solid wl-btn--sm">Confirmar</button>
  <button class="wl-btn wl-btn--quiet wl-btn--sm">Detalhes</button>
  <button class="wl-icon-btn" aria-label="Notificações"><svg class="wl-i" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></svg><span class="wl-notify"></span></button>
  <button class="wl-icon-btn wl-icon-btn--sunken wl-icon-btn--sm" aria-label="Abrir"><svg class="wl-i" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg></button>
  <button class="wl-icon-btn wl-icon-btn--sunken wl-icon-btn--sm" aria-label="Filtros"><svg class="wl-i" viewBox="0 0 24 24"><path d="M4 8h10M18 8h2M4 16h2M10 16h10"/><circle cx="16" cy="8" r="2"/><circle cx="8" cy="16" r="2"/></svg></button>
</div>
</body>
</html>
