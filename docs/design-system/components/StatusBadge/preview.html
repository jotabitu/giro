<!-- @dsCard group="Status" height=232 subtitle="Status do veículo, prioridade e contadores" -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>StatusBadge</title></head>
<body>
<div class="wl-stage">
  <span class="wl-badge wl-badge--success">Disponível</span>
  <span class="wl-badge wl-badge--info">Reservado</span>
  <span class="wl-badge wl-badge--solid">Alugado</span>
  <span class="wl-badge wl-badge--warning">Em manutenção</span>
  <span class="wl-badge">Em preparação</span>
  <span class="wl-badge wl-badge--critical">Atrasado</span>
</div>
<div class="wl-stage" style="padding-top:0">
  <span class="wl-badge wl-badge--high">Alta</span>
  <span class="wl-badge wl-badge--warning">Média</span>
  <span class="wl-badge">Baixa</span>
  <span class="wl-badge wl-badge--attention"><span class="wl-badge__dot"></span>Em vistoria</span>
  <span class="wl-badge wl-badge--brand"><svg class="wl-i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>5 contratos pedem atenção</span>
</div>
<div class="wl-stage" style="padding-top:0">
  <span class="wl-badge wl-badge--sm wl-badge--success">Pago</span>
  <span class="wl-badge wl-badge--sm wl-badge--info">A vencer</span>
  <span class="wl-badge wl-badge--sm wl-badge--critical">Inadimplente</span>
  <span class="wl-count">128</span>
  <span class="wl-count">7</span>
</div>
</body>
</html>
