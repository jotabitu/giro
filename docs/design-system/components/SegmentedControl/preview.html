<!-- @dsCard group="Navegação" height=96 subtitle="Período e filtros de visão" -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>SegmentedControl</title></head>
<body>
<div class="wl-stage">
  <div class="wl-seg" role="group" aria-label="Período">
    <button aria-pressed="false">Hoje</button>
    <button aria-pressed="true">7 dias</button>
    <button aria-pressed="false">30 dias</button>
  </div>
  <div class="wl-seg" role="group" aria-label="Tipo de veículo">
    <button aria-pressed="true">Todos</button>
    <button aria-pressed="false">Motos</button>
    <button aria-pressed="false">Carros</button>
  </div>
</div>
</body>
</html>
