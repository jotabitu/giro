<!-- @dsCard group="Cards" height=360 subtitle="Resumo do que pede ação hoje" -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>AlertCard</title></head>
<body>
<div class="wl-stage">
<section class="wl-alert-card" style="width:460px">
  <div class="wl-alert-card__head"><svg class="wl-i" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>Pendências do dia<span class="wl-alert-card__time">há 6 min</span></div>
  <h3 class="wl-alert-card__title">7 contratos precisam de ação hoje</h3>
  <ul>
    <li class="is-critical">3 devoluções estão atrasadas</li>
    <li class="is-warning">2 motos passaram da revisão de 5.000 km</li>
    <li>2 parcelas vencem até amanhã</li>
  </ul>
  <button class="wl-btn wl-btn--brand">Ver pendências</button>
</section>
</div>
</body>
</html>
