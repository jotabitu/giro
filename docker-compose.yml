# Ambiente de desenvolvimento do Giro. Uso: make up (ou docker compose up).
# Variáveis vêm de .env (copiado de .env.example por make up).

x-backend: &backend
  build:
    context: .
    dockerfile: infra/docker/backend.Dockerfile
    target: dev
  env_file: .env
  restart: unless-stopped
  environment:
    GIRO_ARQUIVOS_FALSOS_DIRETORIO: /arquivos-dev
  volumes:
    - ./backend:/app
    - arquivosdev:/arquivos-dev
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD_MIGRACAO: ${POSTGRES_PASSWORD_MIGRACAO}
      POSTGRES_PASSWORD_APP: ${POSTGRES_PASSWORD_APP}
    ports:
      - "${PORTA_POSTGRES}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${PORTA_REDIS}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *backend
    environment:
      GIRO_ARQUIVOS_FALSOS_DIRETORIO: /arquivos-dev
      RODAR_MIGRACOES: "1"
      # Credencial com DDL só no worker (T-352): o web não a recebe, mesmo vindo do .env.
      DATABASE_URL_MIGRACAO: ""
    ports:
      - "${PORTA_BACKEND}:8000"
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

  # Único serviço com a DATABASE_URL_MIGRACAO (vem do .env): a aud_08_apagar_empresas roda aqui
  # e apaga o schema da empresa cancelada com ela (T-352, ADR 0016 e 0025). O backend manda essa
  # tarefa para a fila `apagamento` (CELERY_TASK_ROUTES, T-382); no desenvolvimento um worker só
  # lê as duas filas. Em homologação e produção são dois workers.
  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "-Q", "celery,apagamento"]

  beat:
    <<: *backend
    environment:
      GIRO_ARQUIVOS_FALSOS_DIRETORIO: /arquivos-dev
      DATABASE_URL_MIGRACAO: ""
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    env_file: .env
    # O frontend não usa a credencial com DDL, mas lê o .env inteiro: zerada (T-352, T-382).
    environment:
      DATABASE_URL_MIGRACAO: ""
    restart: unless-stopped
    ports:
      - "${PORTA_FRONTEND}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  arquivosdev:
  frontend_node_modules:
  frontend_next:
